[workspace]
members = ["crates/*", "duscope", "tests/fixtures/mktree"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kawadeomkar/duscope"
homepage = "https://github.com/kawadeomkar/duscope"
# What a published crate ships: its sources, its README and the two licence
# texts (symlinks to the ones at the root). Tests stay out: they read files of
# the repository, which a packaged crate does not have.
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[workspace.dependencies]
# The workspace crates, in publish order: each depends only on crates above it.
duscope-walk = { path = "crates/duscope-walk", version = "0.1.0" }
duscope-core = { path = "crates/duscope-core", version = "0.1.0" }
duscope-treemap = { path = "crates/duscope-treemap", version = "0.1.0" }
duscope-tui = { path = "crates/duscope-tui", version = "0.1.0" }
duscope-mcp = { path = "crates/duscope-mcp", version = "0.1.0" }

# Unpublished workspace members: the test environment and the fixture-tree generator.
duscope-testkit = { path = "crates/duscope-testkit" }
mktree = { path = "tests/fixtures/mktree" }

# Dependencies of the published crates. 0.x crates are pinned with `=`; crates
# at 1.0 or later take the caret range with Cargo.lock as the real pin.
bitflags = "2.13.2"
# No `color` (duscope styles its own help) and no `wrap_help`, which pulls in the
# banned `terminal_size`: the help text is written to fit 80 columns.
clap_complete = { version = "4.6.11", default-features = false }
clap_mangen = { version = "=0.3.3", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
crossbeam-deque = "=0.8.8"
crossbeam-utils = "=0.8.23"
# Default features off: the `log` feature only logs how patterns compile.
gix-ignore = { version = "=0.24.1", default-features = false }
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
globset = { version = "=0.4.20", default-features = false }
libc = "=0.2.191"
log = "=0.4.34"
# The allocator of the musl builds only (P1-BENCH-03); no default features.
mimalloc = { version = "=0.1.52", default-features = false }
# The index (P2-IDX-02): `bundled` compiles the SQLite the binary ships, with
# the features duscope does not use left out (.cargo/config.toml). 0.40.2 is
# the newest release the 1.88 toolchain builds: 0.41 needs 1.89.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
# Scan ids: SHA-256 of the root, the start time and 8 random bytes.
sha2 = { version = "=0.11.1", default-features = false }
thiserror = "2.0.21"
# Default features off: no `cjk`, whose ambiguous-width variant the map does not use.
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
unicode-width = { version = "=0.2.2", default-features = false }

# Dev-dependencies. 0.x crates are pinned with `=`; crates at 1.0 or later take
# the caret range with Cargo.lock as the real pin.
assert_cmd = "2.2.2"
cargo_metadata = "=0.23.1"
# Default features off: they fetch remote `$ref`s over HTTP (reqwest, rustls).
jsonschema = { version = "=0.60.0", default-features = false }
# Default features off but `std`: no forked or timed-out test cases.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tempfile = "3.27.0"
termlens = { version = "=0.11.6", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"

# Thin LTO: a cold release build on arm64 macOS took 31.7 s against fat LTO's
# 43.9 s, for a binary 3.8% larger, with scans of T1 and T2 and the index queries
# as fast within noise (1,353 against 1,358 ms on T1, 3,640 against 3,614 ms on
# T2); fat LTO had put the shared runners' cold builds past the spec's 90 s.
#
# Abort on panic: no unwinding tables or landing pads, which were 13% of the
# binary (arm64 macOS: 4,889,664 bytes against 5,635,232), with T1 and T2 scans
# as fast within noise (1,317 against 1,316 ms and 3,226 against 3,212 ms,
# medians). A panic is a bug either way; it now ends the process where it
# happens, and the tests, which always unwind, are unaffected.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The bundled SQLite (P2-IDX-02) at -O1, on every target: one 250,000-line C file
# whose compile sits on the critical path of a cold build. On the shared runners
# it took 28 to 43 s of builds of 74 to 99 s at cc's -O3, and takes 10 to 27 s of
# 49 to 81 s at -O1 (run 41235689135; DEV-66). The index writes as fast: 0.78 to
# 0.96 us/entry on T1 and T2 on arm64 macOS, against 0.80 to 1.00 at -O3, and
# 1.74 to 1.93 on T1 to T3 on the Linux bench runner, against 1.88 to 2.12 at
# -Os. The override reaches SQLite alone, so mimalloc keeps -O3, and the `dist`
# profile inherits it.
[profile.release.package.libsqlite3-sys]
opt-level = 1

# cargo-dist always builds with a profile named `dist`. It is the release profile
# unchanged, so the archives hold the binary `just repro` builds for their target.
[profile.dist]
inherits = "release"
