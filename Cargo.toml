[workspace]
members = ["crates/*", "duscope", "tests/fixtures/mktree"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kawadeomkar/duscope"
homepage = "https://github.com/kawadeomkar/duscope"
# What a published crate ships: its sources, its README and the two licence
# texts (symlinks to the ones at the root). Tests stay out: they read files of
# the repository, which a packaged crate does not have.
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[workspace.dependencies]
# The workspace crates, in publish order: each depends only on crates above it.
duscope-walk = { path = "crates/duscope-walk", version = "0.2.0" }
duscope-core = { path = "crates/duscope-core", version = "0.2.0" }
duscope-treemap = { path = "crates/duscope-treemap", version = "0.2.0" }
duscope-tui = { path = "crates/duscope-tui", version = "0.2.0" }
duscope-mcp = { path = "crates/duscope-mcp", version = "0.2.0" }

# Unpublished workspace members: the test environment and the fixture-tree generator.
duscope-testkit = { path = "crates/duscope-testkit" }
mktree = { path = "tests/fixtures/mktree" }

# Dependencies of the published crates. 0.x crates are pinned with `=`; crates
# at 1.0 or later take the caret range with Cargo.lock as the real pin.
bitflags = "2.13.2"
# No `color` (duscope styles its own help) and no `wrap_help`, which pulls in the
# banned `terminal_size`: the help text is written to fit 80 columns.
clap_complete = { version = "4.6.11", default-features = false }
clap_mangen = { version = "=0.3.3", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
crossbeam-deque = "=0.8.8"
crossbeam-utils = "=0.8.23"
# The viewer's terminal (P4-TUI-01): raw mode, the alternate screen, mouse
# capture and the key, mouse and resize events. Default features: ratatui-crossterm
# asks for them, so `bracketed-paste` and `derive-more` are compiled in whatever
# this line says (DEV-72); the viewer never turns bracketed paste on.
crossterm = "=0.29.0"
# The gzip of `export --format gpscan` (P2-CLI-02): the pure-Rust backend
# (miniz_oxide) alone.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Default features off: the `log` feature only logs how patterns compile.
gix-ignore = { version = "=0.24.1", default-features = false }
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
globset = { version = "=0.4.20", default-features = false }
# The MAC of `explain`'s handles (P2-CORE-01), over the SHA-256 of sha2.
hmac = "=0.13.0"
libc = "=0.2.191"
log = "=0.4.34"
# The allocator of the musl builds only (P1-BENCH-03); no default features.
mimalloc = { version = "=0.1.52", default-features = false }
# The XML of `import`'s .gpscan files (P2-CLI-03): a streaming reader, no
# default features.
quick-xml = { version = "=0.42.0", default-features = false }
# The viewer's cell buffer, styles and frame diff (P4-TUI-01): ratatui's core
# crate without its widget set, and its crossterm backend, pinned together.
ratatui-core = { version = "=0.1.2", default-features = false, features = ["std"] }
ratatui-crossterm = { version = "=0.1.2", default-features = false, features = ["crossterm_0_29"] }
# The pixel treemap behind the `pixels` feature (P4-TUI-07): the picker that
# asks the terminal for Kitty graphics, Sixel or iTerm2, and their encoders.
# Default features off: no chafa (a C library), no `image` default codecs (its
# `png` stays, which the crate asks for) and no crossterm backend for ratatui.
ratatui-image = { version = "11.1.0", default-features = false }
# The picture handed to ratatui-image's encoders, as the image crate's RGB
# buffer: the version ratatui-image asks for, with no codec of its own (the
# `png` ratatui-image turns on stays).
image = { version = "=0.25.10", default-features = false }
# The index (P2-IDX-02): `bundled` compiles the SQLite the binary ships, with
# the features duscope does not use left out (.cargo/config.toml); `functions`,
# `hooks` and `limits` for the `query --sql` sandbox (P2-QRY-07). 0.40.2 is
# the newest release the 1.88 toolchain builds: 0.41 needs 1.89.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "functions", "hooks", "limits"] }
# The `pixels` feature's guard on the terminal's modes around the picker's
# probe (P4-TUI-07): the version crossterm already brings, with the features it
# already turns on.
rustix = { version = "1.1.5", default-features = false, features = ["std", "termios"] }
# Scan ids: SHA-256 of the root, the start time and 8 random bytes.
sha2 = { version = "=0.11.1", default-features = false }
thiserror = "2.0.21"
# `clean`'s Trash (P4-CORE-01): NSFileManager's trashItemAtURL on macOS, the
# XDG Trash on Linux. Default features off: no `chrono`, whose only use is the
# `.trashinfo` file's DeletionDate (jiff is the tree's date library).
trash = { version = "5.2.9", default-features = false }
# Default features off: no `cjk`, whose ambiguous-width variant the map does not use.
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
unicode-width = { version = "=0.2.2", default-features = false }

# Dev-dependencies. 0.x crates are pinned with `=`; crates at 1.0 or later take
# the caret range with Cargo.lock as the real pin.
assert_cmd = "2.2.2"
cargo_metadata = "=0.23.1"
# Default features off: they fetch remote `$ref`s over HTTP (reqwest, rustls).
jsonschema = { version = "=0.60.0", default-features = false }
# Default features off but `std`: no forked or timed-out test cases.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The MCP conformance oracle (D36): rmcp's client, which deny.toml keeps out of
# everything but dev-dependencies, pinned exactly at the version P3-MCP-02's
# acceptance names so it cannot move under the tests. Default features off, so
# its server half, macros and schemars stay out; `transport-async-rw` speaks
# over the pipes the tests hand it.
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-async-rw"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
# `raw_value`: a tool result carries the verb's envelope as the verb wrote it
# (P3-MCP-03).
serde_json = { version = "1.0.154", default-features = false, features = ["std", "raw_value"] }
tempfile = "3.27.0"
termlens = { version = "=0.11.6", default-features = false }
# The runtime rmcp's client runs on in the MCP tests, and the pipes it reads.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"

# Thin LTO: a cold release build on arm64 macOS took 31.7 s against fat LTO's
# 43.9 s, for a binary 3.8% larger, with scans of T1 and T2 and the index queries
# as fast within noise (1,353 against 1,358 ms on T1, 3,640 against 3,614 ms on
# T2); fat LTO had put the shared runners' cold builds past the spec's 90 s.
#
# Abort on panic: no unwinding tables or landing pads, which were 13% of the
# binary (arm64 macOS: 4,889,664 bytes against 5,635,232), with T1 and T2 scans
# as fast within noise (1,317 against 1,316 ms and 3,226 against 3,212 ms,
# medians). A panic is a bug either way; it now ends the process where it
# happens, and the tests, which always unwind, are unaffected.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The bundled SQLite (P2-IDX-02) at -O1, on every target: one 250,000-line C file
# whose compile sits on the critical path of a cold build. On the shared runners
# it took 28 to 43 s of builds of 74 to 99 s at cc's -O3, and takes 10 to 27 s of
# 49 to 81 s at -O1 (run 41235689135; DEV-66). The index writes as fast: 0.78 to
# 0.96 us/entry on T1 and T2 on arm64 macOS, against 0.80 to 1.00 at -O3, and
# 1.74 to 1.93 on T1 to T3 on the Linux bench runner, against 1.88 to 2.12 at
# -Os. The override reaches SQLite alone, so mimalloc keeps -O3, and the `dist`
# profile inherits it.
[profile.release.package.libsqlite3-sys]
opt-level = 1

# The code off the scan's and the queries' hot paths, optimised for size: the
# binary's verbs and output layer, the treemap, the TUI and MCP crates, and the
# command line with its man page and completions, compression (export, import
# and PNG) and the .gpscan reader. The walker, the engine (accounting, index,
# queries), SQLite and JSON output keep their levels. At
# the top of the phase-2 stack this took the stripped arm64 macOS binary from
# 6.16 to 5.19 MB (-16%), and the x86_64 musl one, which passed size_budget by
# about 5% at opt-level 3, back under it. A warm T1 scan (1.33 s) and `top
# --scan` on T2 (2.7 ms) took as long; streaming T2's 875,000 files with `top
# --files --all` took 8% longer. An override of the binary's own package
# drops it back to cargo's default strip (debuginfo), so it restates `strip`.
[profile.release.package.duscope]
opt-level = "z"
strip = true
[profile.release.package.duscope-treemap]
opt-level = "z"
[profile.release.package.duscope-tui]
opt-level = "z"
[profile.release.package.duscope-mcp]
opt-level = "z"
[profile.release.package.clap]
opt-level = "z"
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.clap_lex]
opt-level = "z"
[profile.release.package.clap_complete]
opt-level = "z"
[profile.release.package.clap_mangen]
opt-level = "z"
[profile.release.package.roff]
opt-level = "z"
[profile.release.package.unicode-width]
opt-level = "z"
[profile.release.package.flate2]
opt-level = "z"
[profile.release.package.miniz_oxide]
opt-level = "z"
[profile.release.package.quick-xml]
opt-level = "z"

# cargo-dist always builds with a profile named `dist`. It is the release profile
# unchanged, so the archives hold the binary `just repro` builds for their target.
[profile.dist]
inherits = "release"
