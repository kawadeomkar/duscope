# duscope's file classes (P1-CORE-04): what `by-type` groups files by and what
# the treemap colours them with. Schema and rules: docs/rules.md.
#
# [ext] maps an extension to a class. An extension is the last suffix of a
# name, lower-cased, at most 16 bytes of [a-z0-9+~-]; the five tar.* suffixes
# are kept whole. A file whose extension is not listed is `other`.
#
# [dir] maps a directory to a class, and wins over the extension of every
# file beneath it. A key is a name or a glob, or several joined by `/` that
# must match the directory's last components (`*.app/Contents/MacOS`).
#
# The classes: code, media, archives, data, binaries, docs, other.

[ext]
# archives
"tar.gz" = "archives"
"tar.bz2" = "archives"
"tar.xz" = "archives"
"tar.zst" = "archives"
"tar.lz4" = "archives"
