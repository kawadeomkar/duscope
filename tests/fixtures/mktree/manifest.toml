# Project directories with a marker for every caches.toml rule: node_modules,
# .next, .nuxt, .turbo, .parcel-cache <- package.json; target <- Cargo.toml;
# .venv, venv, __pycache__, .mypy_cache, .pytest_cache, .ruff_cache, .tox <-
# pyproject.toml, setup.py or requirements.txt; build, .gradle <- build.gradle,
