# The duscope reference tree, built by `just fixtures` (tests/fixtures/mktree)
# under target/fixtures.noindex/tree and used by every test through duscope-testkit.
#
# A change to this file, or to the generator in a way that changes the tree,
# changes the manifest hash below, which a test checks. The hash also covers
# the source of the builder (src/build.rs), so any change there records a new
# hash too. Golden files depend on the tree, so such a change is its own TEST
# package (plan/SPEC.md, Testing strategy).
# `mktree --print-plan` prints the expanded manifest the hash covers: diff it
# to review a change.
#
# Format 1:
# - `instant`: every mtime and atime is relative to it; tests export it as
#   DUSCOPE_TEST_NOW. It lies in the future on purpose: ctime (and btime) can
#   never be set, so they are the real build time, and only a "now" later than
#   any build lets `stale`'s `ctime < cutoff` hold. It is before 2038 so
#   filesystems with 32-bit timestamps hold every value.
# - `[[case]]`: named cases with explicit entries under `root`. Kinds: `dir`,
#   `file = <size>` (generated content), `text = "<content>"`, `sparse =
#   <apparent size>` with `data = ["<offset>+<length>", ...]`, `compressed =
#   <size>`, `hardlink`/`clone = "<file>"` (relative to the case root, or to
#   the tree root with a leading `/`), `symlink = "<target>"` (verbatim),
#   `fifo`, `socket`, `many = <n>` (a directory of n empty files) and `chain =
#   <n>` (n nested directories). Modifiers: `mode`, `test_mode` (applied only
#   while a test holds the tree), `age` (instant minus mtime; `s h d w y`),
#   `atime` (instant minus atime; default half the age, at most a year, or
#   half the age after a future mtime), and `nanos`; a hard link takes none of
#   them (it shares its target's inode), and a modifier the kind does not use
#   (`data` outside `sparse`, say) is an error. `%XX` in a path writes a raw
#   byte.
# - `[[generate]]`: seeded random subtrees (integer arithmetic only, so every
#   platform expands them identically).
# Sizes take K, M, G (powers of 1,024). Paths may not differ only in ASCII
# case (APFS is case-insensitive by default).

format = 1
hash = "4851ac65da00d961d7e45bdfc36c50404b447b03edc5f6c7b01c6b9bdf5091d0"
instant = "2037-01-01T00:00:00Z"

# Names for generated directories and files (lower-case ASCII only).
words = [
    "alpha", "archive", "assets", "atlas", "backup", "beacon", "bridge", "budget",
    "cache", "canvas", "cargo", "chart", "client", "cobalt", "config", "core",
    "data", "delta", "design", "draft", "echo", "editor", "ember", "engine",
    "export", "fable", "falcon", "field", "final", "frame", "galaxy", "garden",
    "graph", "harbor", "helix", "hollow", "icon", "index", "input", "island",
    "jade", "journal", "kernel", "kite", "lambda", "ledger", "library", "lumen",
    "maple", "matrix", "media", "meadow", "module", "nebula", "notes", "nova",
    "oasis", "orbit", "output", "packet", "paper", "pixel", "planet", "prism",
    "quartz", "query", "radar", "report", "river", "rocket", "sample", "scene",
    "shadow", "signal", "source", "spark", "stack", "studio", "summit", "table",
    "tango", "temp", "theme", "thread", "tide", "token", "trace", "travel",
    "umbra", "union", "update", "vector", "velvet", "vertex", "view", "violet",
    "wave", "widget", "willow", "window", "xenon", "yarrow", "yield", "zenith",
]

[defaults]
dir_mode = 0o755
file_mode = 0o644
age = "30d"

# Extension pools for generated files by duscope class (`""` is no extension).
# The tar.* suffixes stay whole, as duscope's `ext` rule keeps them.
[extensions]
archives = ["zip", "tar", "gz", "tgz", "xz", "7z", "dmg", "iso", "tar.gz", "tar.zst"]
binaries = ["o", "a", "so", "dylib", "rlib", "rmeta", "wasm", "bin", "node", "pyc", "class", "jar"]
code = ["rs", "py", "js", "mjs", "ts", "tsx", "go", "c", "h", "cc", "hpp", "swift", "java", "kt", "rb", "sh", "css", "html", "vue"]
data = ["json", "csv", "db", "sqlite", "plist", "xml", "yaml", "parquet", "log", "dat", "idx", "ldb", "toml"]
docs = ["md", "txt", "pdf", "docx", "pages", "rtf", "key", "pptx", "xlsx", "epub", "tex"]
media = ["jpg", "jpeg", "png", "heic", "gif", "webp", "svg", "mp4", "mov", "mp3", "m4a", "flac", "wav"]
other = ["", "tmp", "bak", "lock", "d", "part", "swp"]

# ---------------------------------------------------------------------------
# Edge cases, one directory each under cases/.

[[case]]
name = "hard-links"
about = "One 256 KiB inode linked from three directories (nlink 4), a pair, and a linked empty file: hard-link charging to the lowest pre-order id, links_outside_subtree, du parity with links (P1-CORE-03, P2-QRY-04)"
root = "cases/hard-links"
entries = [
    { path = "a/original.bin", file = "256K", age = "90d" },
    { path = "a/same-dir.bin", hardlink = "a/original.bin" },
    { path = "b/other-dir.bin", hardlink = "a/original.bin" },
    { path = "c/deep/nested.bin", hardlink = "a/original.bin" },
    { path = "pair/one.txt", file = "4K", age = "10d" },
    { path = "pair/two.txt", hardlink = "pair/one.txt" },
    { path = "empty/zero", file = 0 },
    { path = "empty/zero-link", hardlink = "empty/zero" },
]

[[case]]
name = "clones"
about = "A 2 MiB file and two clones, one in a subdirectory: cp -c (clonefile) on APFS, cp --reflink=always on btrfs/XFS, plain copies elsewhere (recorded as skipped) (P1-WALK-07, P1-CORE-03)"
root = "cases/clones"
entries = [
    { path = "original.img", file = "2M", age = "60d" },
    { path = "clone-1.img", clone = "original.img", age = "30d" },
    { path = "nested/clone-2.img", clone = "original.img", age = "20d" },
]

[[case]]
name = "sparse"
about = "Sparse files: holes only, data-hole-data, and data at the tail; apparent far above allocated (du --apparent-size parity). Every hole is at least 31 MiB: APFS zero-fills holes under 16 MiB"
root = "cases/sparse"
entries = [
    { path = "hole-only.bin", sparse = "64M" },
    { path = "data-hole-data.bin", sparse = "64M", data = ["0+64K", "65472K+64K"] },
    { path = "tail.bin", sparse = "32M", data = ["32764K+4K"] },
]

[[case]]
name = "compressed"
about = "Files stored with filesystem compression: ditto --hfsCompression on macOS (ditto leaves files of 16 KiB and less uncompressed), chattr +c where the filesystem supports it, else uncompressed (recorded as skipped)"
root = "cases/compressed"
entries = [
    { path = "text-1m.txt", compressed = "1M" },
    { path = "small.txt", compressed = "64K" },
]

[[case]]
name = "unreadable"
about = "Exactly one directory (closed/) with mode 000 while a test holds the tree, with content beneath, beside a readable sibling: error_count = 1, partial_read (P1-WALK-08). Mode 0755 at rest so cargo clean and caches can walk it"
root = "cases/unreadable"
entries = [
    { path = "closed", dir = true, test_mode = 0o000 },
    { path = "closed/a.txt", file = "8K" },
    { path = "closed/sub/b.txt", file = "8K" },
    { path = "open/c.txt", file = "8K" },
]

[[case]]
name = "permissions"
about = "An empty mode-000 directory, a listable but unsearchable (0444) directory whose children cannot be stat'ed, a private 0700 directory, a sticky directory, read-only and executable files"
root = "cases/permissions"
entries = [
    { path = "empty-closed", dir = true, test_mode = 0o000 },
    { path = "list-only", dir = true, test_mode = 0o444 },
    { path = "list-only/x.txt", file = "1K" },
    { path = "list-only/y.txt", file = "1K" },
    { path = "list-only/z.txt", file = "1K" },
