    { path = "readonly.txt", file = 100, mode = 0o444 },
    { path = "exec.sh", file = 100, mode = 0o755 },
]

[[case]]
name = "non-utf8-names"
about = "Names that are not valid UTF-8 (Latin-1, lone continuation bytes, overlong and surrogate encodings, a directory with a file inside), and a valid name whose symlink target is not UTF-8: name plus name_raw. APFS refuses such names (recorded as skipped with the entries absent)"
