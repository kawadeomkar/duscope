[[case]]
name = "git-repo"
about = "A minimal git repository with an unborn main branch (valid HEAD and config) and a .gitignore with an ignored file, an ignored directory and a $-precious entry; placeholder loose objects under .git/objects (never referenced, so no git command reads them) (by-type .git/objects, P2-QRY-04 git facts)"
root = "home/Projects/notes-repo"
entries = [
    { path = ".git/HEAD", text = "ref: refs/heads/main\n" },
    { path = ".git/config", text = "[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n\tbare = false\n" },
    { path = ".git/description", text = "Unnamed repository; edit this file 'description' to name the repository.\n" },
    { path = ".git/info/exclude", text = "# git ls-files --others --exclude-from=.git/info/exclude\n" },
    { path = ".git/refs/heads", dir = true },
    { path = ".git/refs/tags", dir = true },
    { path = ".git/objects/info", dir = true },
    { path = ".git/objects/pack", dir = true },
    { path = ".git/objects/3b/18e512dba79e4c8300dd08aeb37f8e728b8dad", file = 120 },
    { path = ".git/objects/8a/b686eafeb1f44702738c8b0f24f2567c36da6d", file = "2K" },
    { path = ".git/objects/e6/9de29bb2d1d6434b8b29ae775ad8c2e48c5391", file = 15 },
    { path = ".gitignore", text = "*.log\n/drafts/\n$important.cache\n" },
    { path = "notes.md", file = "6K" },
    { path = "debug.log", file = "12K" },
    { path = "important.cache", file = "8K" },
    { path = "drafts/idea.md", file = "1K" },
]

