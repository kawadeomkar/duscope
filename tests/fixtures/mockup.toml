# The proposal's example tree: `duscope scan ~ --save` from its CLI session,
# as the depth-1 treemap mockup draws it (Treemap output, "mockup · the
# example scan from the CLI session above at --depth 1, 11 tiles on an 80×36
# half-cell grid"). The layout, painter and TUI tests share it.
#
# Each tile is a top-level or second-level entry of ~; `gib` is its
# allocated size as the mockup prints it and `bytes` the same in bytes
# (tenths of a GiB times 107374182, so the layout sees the mockup's
# proportions exactly); `class` the file class of most of its bytes, one of
# the taxonomy's seven (the mockup's own labels, app data and build output,
# are purpose classes, which `caches` reports and the map does not colour);
# and `rect` where the squarified layout puts it on the canvas, in
# half-cell units: [x, y, width, height].

root = "/Users/alex"
