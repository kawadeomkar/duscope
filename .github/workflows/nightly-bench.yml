# duscope's nightly benchmarks (plan/SPEC.md "CI/CD", P0-BENCH-02).
#
# bench/run.sh, the full matrix (the three trees, the pinned competitors, warm
# and cold caches), on two self-hosted runners: an Apple-silicon Mac with the
# label `bench-macos` and a Linux x86_64 box with `bench-linux`, described in
# docs/runners.md. The subject is duscope, built from the checkout; `du` is one
# of the competitors. The result files go to the `bench-results` branch as
# <date>-<platform>.json, never to main, and bench/compare.py reads baselines from
# there. Each bench job then checks the binary's du parity on a system tree
# (/Applications, /usr) and its peak RSS on the trees (P1-TEST-01), and holds the
# fixture tree to P0-TEST-01's 30-second build budget, which these quiet machines
# can assert and shared CI runners cannot.
#
# A public repository's pull requests must never reach a self-hosted machine.
# This workflow has no pull_request trigger, every job on a bench-* label also
# carries `if: github.event_name != 'pull_request'`, and only main's copy of the
# workflow reaches the runners (duscope/tests/nightly_bench.rs checks every
# workflow for these). Tokens stay on GitHub-hosted runners: the probe reads the
# runners' status with BENCH_RUNNERS_TOKEN (Administration read, nothing else),
# the publish job pushes with the run's own GITHUB_TOKEN, given contents: write
# there alone, and the bench jobs get no secret and a read-only GITHUB_TOKEN.
#
# An offline runner never fails the run: the probe asks the API which runners
# are online, the bench job of a runner that is not is skipped with a notice,
# and the second consecutive skip opens the pinned issue "nightly-bench
# offline" (or updates its description), which the next run with both runners
# online closes.

name: Nightly bench

on:
  schedule:
    # 03:17, not 03:00: GitHub delays scheduled runs most at the top of the hour,
    # and under load drops some.
    - cron: "17 3 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      trees:
        description: "bench/run.sh --trees"
        default: "all"
      competitors:
        description: "bench/run.sh --competitors"
        default: "all"
      mode:
        description: "bench/run.sh --mode: warm, cold or both"
        default: "both"
      scale:
        description: "bench/run.sh --scale: below 1 for a smoke run"
        default: "1"

permissions:
  contents: read

concurrency:
  # One run at a time: two runs on one runner would measure each other.
  group: nightly-bench
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The harness's arguments: a dispatch's inputs, else the nightly matrix. They
  # reach the scripts as environment variables, never pasted into them.
  TREES: ${{ inputs.trees || 'all' }}
  COMPETITORS: ${{ inputs.competitors || 'all' }}
  MODE: ${{ inputs.mode || 'both' }}
  SCALE: ${{ inputs.scale || '1' }}

jobs:
  probe:
    name: probe
    # A dispatch of another branch's copy of this workflow stops here.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      macos: ${{ steps.runners.outputs.macos }}
      linux: ${{ steps.runners.outputs.linux }}
    steps:
      - name: Which bench runners are online
        id: runners
        env:
          GH_TOKEN: ${{ secrets.BENCH_RUNNERS_TOKEN }}
        run: |
          # Each platform's status: online, offline, missing (no runner has the
          # label) or unknown (the API could not be read). Listing runners needs
          # the Administration (read) permission, which GITHUB_TOKEN never has.
          read_ok=true
          if ! runners=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runners" \
              --jq '.runners[] | {status, labels: [.labels[].name]}' 2>"$RUNNER_TEMP/runners.err"); then
            read_ok=false
            echo "::notice title=nightly-bench::cannot read the runners' status, so no bench job runs (BENCH_RUNNERS_TOKEN is missing or lacks Administration read): $(tr '\n' ' ' < "$RUNNER_TEMP/runners.err")"
          fi
          for platform in macos linux; do
            label="bench-$platform"
            if [[ $read_ok == false ]]; then
              status=unknown
            else
              status=$(jq -rs --arg label "$label" '
                [.[] | select(.labels | index($label))] as $mine
                | if ($mine | length) == 0 then "missing"
                  elif any($mine[]; .status == "online") then "online"
                  else "offline" end' <<<"$runners")
            fi
            echo "$platform=$status" >> "$GITHUB_OUTPUT"
            echo "$label: $status"
            if [[ $status != online && $read_ok == true ]]; then
              echo "::notice title=nightly-bench::the $label runner is $status, so bench-$platform is skipped"
            fi
          done

      - name: Open, update or close the offline issue
        # Bookkeeping: a failure here never fails the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS: ${{ steps.runners.outputs.macos }}
          LINUX: ${{ steps.runners.outputs.linux }}
        run: |
          title="nightly-bench offline"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          # The run before this one on main, to tell a second skip from a first.
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly-bench.yml/runs?branch=main&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .status == \"completed\")][0].id // empty")
          down=""
          again=""
          for platform in macos linux; do
            case $platform in macos) status=$MACOS ;; linux) status=$LINUX ;; esac
            [[ $status == online ]] && continue
            down="$down bench-$platform ($status)"
            if [[ -n $previous ]]; then
              before=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous/jobs" \
                --jq ".jobs[] | select(.name == \"bench-$platform\") | .conclusion")
              [[ $before == skipped ]] && again="$again bench-$platform"
            fi
          done
          if [[ -z $down ]]; then
            if [[ -n $issue ]]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Both bench runners are online again: $run_url"
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          if [[ -z $again ]]; then
            echo "skipped for the first time in a row:$down; no issue yet"
            exit 0
          fi
          body="Skipped twice in a row:$again. Not online now:$down. Latest run: $run_url

          docs/runners.md says how to check a runner and re-register it. The next run with both runners online closes this issue."
          if [[ -n $issue ]]; then
            # The description says where things stand; editing it notifies no one,
            # so a runner that stays away for weeks does not ping every night.
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body")
            # Pinned, so it heads the issue list; pinning is best effort.
            gh issue pin "$url" --repo "$GITHUB_REPOSITORY" || echo "::notice title=nightly-bench::could not pin $url"
          fi

  bench-macos:
    name: bench-macos
    needs: probe
    if: github.event_name != 'pull_request' && needs.probe.outputs.macos == 'online'
    runs-on: [self-hosted, bench-macos]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build duscope
        run: |
          # In the runner's own target directory, outside the checkout.
          home=${BENCH_HOME:-$HOME/duscope-bench}
          rustup toolchain install --profile minimal
          CARGO_TARGET_DIR="$home/target" cargo build --release --locked -p duscope
          echo "DUSCOPE_BIN=$home/target/release/duscope" >> "$GITHUB_ENV"
      - name: Run the harness
        id: harness
        run: |
          # The trees and tools live outside the checkout, under BENCH_HOME (set in
          # the runner's .env, docs/runners.md), so a clean checkout keeps them.
          home=${BENCH_HOME:-$HOME/duscope-bench}
          results="$RUNNER_TEMP/bench-results"
          rm -rf "$results"
          status=0
          # The trees live on an APFS disk image that the cold command detaches and
          # attaches around each purge, which alone leaves APFS's metadata cached
          # (bench/README.md, "Cold runs"). The first night creates the image; a
          # night after a reboot attaches it, so warm-only runs find the trees too.
          image="$home/trees.sparsebundle"
          volume="$home/trees-volume"
          if [[ ! -d $image ]]; then
            hdiutil create -quiet -type SPARSEBUNDLE -fs APFS -size 100g -volname duscope-bench-trees "$image"
          fi
          mkdir -p "$volume"
          if [[ $(mount) != *" on $volume ("* ]]; then
            hdiutil attach -quiet -nobrowse -noverify -noautoopen -mountpoint "$volume" "$image"
          fi
          cold="$PWD/bench/drop-caches.sh --remount $(printf %q "$image") $(printf %q "$volume")"
          # bench-macos is a laptop that sleeps when idle: caffeinate keeps it awake
          # until the harness exits.
          file=$(caffeinate -is bench/run.sh run --subject duscope --tool-path "duscope=$DUSCOPE_BIN" \
            --trees "$TREES" --competitors "$COMPETITORS" \
            --mode "$MODE" --scale "$SCALE" --trees-dir "$volume/trees" --tools-dir "$home/tools" \
            --cold-cmd "$cold" --results-dir "$results") || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -n $file && -f $file ]]; then echo "file=$file" >> "$GITHUB_OUTPUT"; fi
      # The result file is published even when a tool could not be measured: the
      # file says which and why.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.harness.outputs.file != '' }}
        with:
          name: bench-macos
          path: ${{ steps.harness.outputs.file }}
          if-no-files-found: error
          retention-days: 90
      - name: Fail when the harness did
        if: ${{ steps.harness.outputs.status != '0' }}
        run: |
          echo "::error title=nightly-bench::bench/run.sh exited ${STATUS:-early}; the job log and the result file say why"
          exit 1
        env:
          STATUS: ${{ steps.harness.outputs.status }}
      # P1-TEST-01: the binary the harness measured (DUSCOPE_BIN) totals what
      # du does on a system tree, and its peak RSS per entry with --attrs full
      # stays within budget on the trees the harness just measured.
      - name: du parity on /Applications
        if: ${{ !cancelled() }}
        run: |
          home=${BENCH_HOME:-$HOME/duscope-bench}
          DUSCOPE_TEST_PLATFORM=1 DUSCOPE_PARITY_ROOT=/Applications DUSCOPE_BENCH_BIN="$DUSCOPE_BIN" CARGO_TARGET_DIR="$home/target" \
            caffeinate -is cargo test --release --locked -p duscope --test suite \
            -- --ignored --exact p1_test_01_scan_totals_equal_du_on_a_system_tree
      - name: Peak RSS within budget
        if: ${{ !cancelled() }}
        run: |
          home=${BENCH_HOME:-$HOME/duscope-bench}
          DUSCOPE_TEST_PLATFORM=1 DUSCOPE_BENCH_BIN="$DUSCOPE_BIN" DUSCOPE_BENCH_TREES="$home/trees-volume/trees" CARGO_TARGET_DIR="$home/target" \
            caffeinate -is cargo test --release --locked -p duscope --test suite \
            -- --ignored --exact --nocapture p1_test_01_peak_rss_per_entry_on_the_bench_trees
      # P0-TEST-01's acceptance check, here because a quiet machine can hold the
      # fixture tree to its budget and shared CI runners cannot (they report the
      # time only): the debug build `just fixtures` runs, in under 30 s.
      - name: Fixture tree within its 30-second budget
        if: ${{ !cancelled() }}
        run: |
          home=${BENCH_HOME:-$HOME/duscope-bench}
          out="$RUNNER_TEMP/fixtures"
          rustup toolchain install --profile minimal
          CARGO_TARGET_DIR="$home/target" caffeinate -is cargo run --quiet --locked -p mktree -- --out "$out" --force
          ms=$(sed -n 's/^build_ms = //p' "$out/record.toml")
          rm -rf "$out"
          if [[ ! $ms =~ ^[0-9]+$ ]]; then
            echo "::error title=nightly-bench::mktree recorded no build time"
            exit 1
          fi
          if (( ms >= 30000 )); then
            echo "::error title=nightly-bench::the fixture tree took $ms ms to build, over P0-TEST-01's 30 s budget"
            exit 1
          fi
          echo "the fixture tree built in $ms ms of P0-TEST-01's 30000"

  bench-linux:
    name: bench-linux
    needs: probe
    if: github.event_name != 'pull_request' && needs.probe.outputs.linux == 'online'
    runs-on: [self-hosted, bench-linux]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build duscope
        run: |
          # In the runner's own target directory, outside the checkout. The musl build:
          # what the Linux archives and .debs ship (docs/runners.md installs musl-tools).
          home=${BENCH_HOME:-$HOME/duscope-bench}
          target="$(uname -m)-unknown-linux-musl"
          rustup toolchain install --profile minimal
          rustup target add "$target"
          CARGO_TARGET_DIR="$home/target" cargo build --release --locked -p duscope --target "$target"
          echo "DUSCOPE_BIN=$home/target/$target/release/duscope" >> "$GITHUB_ENV"
      - name: Run the harness
        id: harness
        run: |
          # The trees and tools live outside the checkout, under BENCH_HOME (set in
          # the runner's .env, docs/runners.md), so a clean checkout keeps them.
          home=${BENCH_HOME:-$HOME/duscope-bench}
          results="$RUNNER_TEMP/bench-results"
          rm -rf "$results"
          status=0
          file=$(bench/run.sh run --subject duscope --tool-path "duscope=$DUSCOPE_BIN" \
            --trees "$TREES" --competitors "$COMPETITORS" \
            --mode "$MODE" --scale "$SCALE" --trees-dir "$home/trees" --tools-dir "$home/tools" \
            --results-dir "$results") || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -n $file && -f $file ]]; then echo "file=$file" >> "$GITHUB_OUTPUT"; fi
      # The result file is published even when a tool could not be measured: the
      # file says which and why.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.harness.outputs.file != '' }}
        with:
          name: bench-linux
          path: ${{ steps.harness.outputs.file }}
          if-no-files-found: error
          retention-days: 90
      - name: Fail when the harness did
        if: ${{ steps.harness.outputs.status != '0' }}
        run: |
          echo "::error title=nightly-bench::bench/run.sh exited ${STATUS:-early}; the job log and the result file say why"
          exit 1
        env:
          STATUS: ${{ steps.harness.outputs.status }}
      # P1-TEST-01: the binary the harness measured (DUSCOPE_BIN) totals what
      # du does on a system tree, and its peak RSS per entry with --attrs full
      # stays within budget on the trees the harness just measured.
      - name: du parity on /usr
        if: ${{ !cancelled() }}
        run: |
          home=${BENCH_HOME:-$HOME/duscope-bench}
          DUSCOPE_TEST_PLATFORM=1 DUSCOPE_PARITY_ROOT=/usr DUSCOPE_BENCH_BIN="$DUSCOPE_BIN" CARGO_TARGET_DIR="$home/target" \
            cargo test --release --locked -p duscope --test suite \
            -- --ignored --exact p1_test_01_scan_totals_equal_du_on_a_system_tree
      - name: Peak RSS within budget
        if: ${{ !cancelled() }}
        run: |
          home=${BENCH_HOME:-$HOME/duscope-bench}
          DUSCOPE_TEST_PLATFORM=1 DUSCOPE_BENCH_BIN="$DUSCOPE_BIN" DUSCOPE_BENCH_TREES="$home/trees" CARGO_TARGET_DIR="$home/target" \
            cargo test --release --locked -p duscope --test suite \
            -- --ignored --exact --nocapture p1_test_01_peak_rss_per_entry_on_the_bench_trees
      # P0-TEST-01's acceptance check, here because a quiet machine can hold the
      # fixture tree to its budget and shared CI runners cannot (they report the
      # time only): the debug build `just fixtures` runs, in under 30 s.
      - name: Fixture tree within its 30-second budget
        if: ${{ !cancelled() }}
        run: |
          home=${BENCH_HOME:-$HOME/duscope-bench}
          out="$RUNNER_TEMP/fixtures"
          rustup toolchain install --profile minimal
          CARGO_TARGET_DIR="$home/target" cargo run --quiet --locked -p mktree -- --out "$out" --force
          ms=$(sed -n 's/^build_ms = //p' "$out/record.toml")
          rm -rf "$out"
          if [[ ! $ms =~ ^[0-9]+$ ]]; then
            echo "::error title=nightly-bench::mktree recorded no build time"
            exit 1
          fi
          if (( ms >= 30000 )); then
            echo "::error title=nightly-bench::the fixture tree took $ms ms to build, over P0-TEST-01's 30 s budget"
            exit 1
          fi
          echo "the fixture tree built in $ms ms of P0-TEST-01's 30000"

  publish:
    name: publish
    needs: [probe, bench-macos, bench-linux]
    # After the bench jobs whatever they did, when at least one of them ran.
    if: ${{ always() && needs.probe.result == 'success' && (needs.bench-macos.result != 'skipped' || needs.bench-linux.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The push to bench-results; branch protection keeps the token off main.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # No artifact when no bench job got as far as a result file.
        continue-on-error: true
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      # The run's GITHUB_TOKEN stays in the checkout's git config for the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Commit the result files to bench-results
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/results/*.json)
          if (( ${#files[@]} == 0 )); then
            echo "::notice title=nightly-bench::no result file to publish"
            exit 0
          fi
          # The branch holds nothing but result files and its README; the first
          # run creates it.
          if git ls-remote --exit-code --heads origin bench-results >/dev/null; then
            git fetch -q --depth 1 origin bench-results
            git switch -q -c bench-results FETCH_HEAD
          else
            git switch -q --orphan bench-results
            printf '%s\n' \
              "# bench-results" \
              "" \
              "Result files of duscope's nightly benchmarks, one \`<date>-<platform>.json\` per" \
              "runner and day, pushed by \`.github/workflows/nightly-bench.yml\` on main." \
              "bench/README.md (\"Result file\") documents the format; bench/compare.py reads" \
              "these files as baselines. Nothing else is committed here." > README.md
            git add README.md
          fi
          cp "${files[@]}" .
          names=()
          for f in "${files[@]}"; do names+=("$(basename "$f")"); done
          git add -- "${names[@]}"
          if git diff --cached --quiet; then
            echo "::notice title=nightly-bench::the result files are already on bench-results"
            exit 0
          fi
          git -c user.name="duscope nightly-bench" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Nightly results: ${names[*]}" -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -q origin bench-results
          echo "published ${names[*]} to bench-results"
