# duscope releases (plan/SPEC.md "Versioning, branching and releases", P0-CI-02).
#
# A signed `v*` tag on a commit of main runs this workflow:
#
#   verify-tag   the tag is signed by a key in .github/allowed_signers (as main has it
#                now), points at a commit on main, names the workspace version, and its
#                commit carries the version's dated CHANGELOG.md section
#   plan         `dist host --steps=create`: what to build (pull requests: `dist plan`)
#   build-local-artifacts
#                one archive per target under the `just repro` environment, built
#                with cargo-auditable and attested
#   build-global-artifacts
#                the shell installer and the checksums
#   deb-assets   the man page and completions, written once by a host build
#   deb          the .deb of each musl target with cargo-deb, from the binary of
#                that target's archive, lintian-clean and attested (P1-PKG-01)
#   deb-install  each .deb installed and run in Debian 12 and Ubuntu 22.04
#   host         the GitHub Release, its notes from CHANGELOG.md, with the .debs
#   publish-crates
#                the six crates on crates.io, in dependency order, through
#                trusted publishing (no standing token; docs/RELEASING.md)
#   homebrew     the version-bump pull request in kawadeomkar/homebrew-tap
#                (P1-PKG-02); the tap's own workflows build and publish bottles
#   announce     nothing more yet (dist's last phase)
#
# Every job needs verify-tag, directly or through plan, and the jobs that use
# always() still require plan or host to have succeeded, so a tag that fails
# verification builds, hosts and publishes nothing.
#
# This file began as the output of `dist generate` (cargo-dist 0.33.1, configured by
# dist-workspace.toml) and is maintained by hand from there (`allow-dirty = ["ci"]`):
# dist's plan-jobs cannot gate its host job, which runs under always(). The changes
# from dist's output: the verify-tag job, which plan needs; the publish-crates job;
# the token read-only at the top, widened per job; the tag pattern narrowed to v*;
# a timeout on every job; cargo-auditable and just installed at pinned versions with
# checksums (dist installs the latest cargo-auditable); dist installed by its
# installer checked against DIST_INSTALLER_SHA256 before it runs, in place of dist's
# `curl | sh` (the installer checks the archive it downloads); the `just repro`
# environment for the builds; every action pinned to a commit SHA with its version in
# a comment.
# After a dist upgrade, regenerate into a scratch copy and carry these over.

name: Release

on:
  # Pull requests run verify-tag (nothing to verify), `dist plan`, which checks
  # dist-workspace.toml against the workspace, and the three .deb jobs.
  pull_request:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  # The task runner, at ci.yml's pin.
  JUST_VERSION: "1.59.0"
  # The release builder, at dist-workspace.toml's and the justfile's pin, and the
  # SHA-256 of its installer, which holds the SHA-256 of every dist archive.
  DIST_VERSION: "0.33.1"
  DIST_INSTALLER_SHA256: "a7b3b0812d624a09a534ba272aa8e04c801e56a83d553327a4a8632bc03abb94"
  # Embeds the dependency list in each binary (`cargo auditable`).
  CARGO_AUDITABLE_VERSION: "0.7.7"
  # The .deb builder, at the justfile's pin.
  CARGO_DEB_VERSION: "3.8.0"

jobs:
  verify-tag:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Nothing to verify
        if: ${{ github.event_name != 'push' }}
        run: echo "Not a tag push; release.yml only plans."
      - name: Verify the tag
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          fail() { echo "::error title=verify-tag::$*"; exit 1; }
          [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]] || fail "$TAG is not a vMAJOR.MINOR.PATCH tag"
          version=${BASH_REMATCH[1]}

          # Fetch the tag object itself (a checkout may record an annotated tag as a
          # lightweight one) and main as it is now.
          git fetch --no-tags --force origin "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/main:refs/remotes/origin/main"
          [[ $(git cat-file -t "refs/tags/$TAG") == tag ]] || fail "$TAG is a lightweight tag; release tags are made with git tag -s"

          # The signers main lists now, so a key removed from main signs no later release.
          git show refs/remotes/origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "refs/tags/$TAG" ||
            fail "$TAG is not signed by a key in .github/allowed_signers on main"

          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || fail "$TAG points at $commit, which is not on main"
          [[ $(git rev-parse HEAD) == "$commit" ]] || fail "the checkout is $(git rev-parse HEAD), not the tagged commit $commit"

          # Every crate the release ships carries the tag's version, and Cargo.lock agrees.
          others=$(cargo metadata --locked --format-version 1 | jq -r --arg v "$version" '
            .workspace_members as $members
            | .packages[] | select(.id as $id | $members | index($id))
            | select(.publish != []) | select(.version != $v) | "\(.name) \(.version)"')
          [[ -z $others ]] || fail "$TAG names $version, but these crates have another version: $(echo $others)"

          # The REL commit assembled the changelog.d fragments into the version's section.
          grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md ||
            fail "CHANGELOG.md has no dated section for $version; run scripts/changelog.py assemble $version before tagging"
          fragments=$(find changelog.d -type f -name '*.md' ! -name README.md | sort)
          [[ -z $fragments ]] || fail "changelog.d still holds fragments ($(echo $fragments)); assemble them before tagging"
          echo "$TAG: signed by an allowed signer, on main, version $version, changelog assembled"

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    needs:
      - verify-tag
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # The installer is checked before it runs; it then checks the dist archive
        # it downloads (sha256sum is on every runner; the check line needs it too).
        shell: bash
        run: |
          installer="$RUNNER_TEMP/dist-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf -o "$installer" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$DIST_VERSION/cargo-dist-installer.sh"
          echo "$DIST_INSTALLER_SHA256  $installer" | sha256sum -c -
          sh "$installer"
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    # Attests the archives (Sigstore through the OIDC token).
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      # dist's plan gives its unchecked `curl | sh` as matrix.install_dist.
      - name: Install dist
        # The installer is checked before it runs; it then checks the dist archive
        # it downloads (sha256sum is on every runner; the check line needs it too).
        shell: bash
        run: |
          installer="$RUNNER_TEMP/dist-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf -o "$installer" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$DIST_VERSION/cargo-dist-installer.sh"
          echo "$DIST_INSTALLER_SHA256  $installer" | sha256sum -c -
          sh "$installer"
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install cargo-auditable and just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-auditable@${{ env.CARGO_AUDITABLE_VERSION }},just@${{ env.JUST_VERSION }}
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Use the reproducible build environment
        # SOURCE_DATE_EPOCH, CARGO_INCREMENTAL and the RUSTFLAGS path remapping that
        # `just repro` builds with; dist adds its own flags to these RUSTFLAGS.
        shell: bash
        run: just repro-env target | tee -a "$GITHUB_ENV"
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # The man page and completions both .debs carry, written once by a host build
  # of the commit (P1-PKG-01). The three .deb jobs run on pull requests too, so a
  # release is never the first run of the packaging; only the attestation and
  # the GitHub Release are a tag's alone.
  deb-assets:
    needs:
      - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the man page and completions
        run: |
          rustup toolchain install --profile minimal
          cargo build --release --locked -p duscope
          mkdir -p target/deb-assets
          target/release/duscope man > target/deb-assets/duscope.1
          target/release/duscope completions bash > target/deb-assets/duscope.bash
          target/release/duscope completions zsh > target/deb-assets/_duscope
          target/release/duscope completions fish > target/deb-assets/duscope.fish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-assets
          path: target/deb-assets/
          if-no-files-found: error

  # The .deb of each musl target: cargo-deb on the binary of that target's
  # release archive, lintian-clean, attested. A pull request, which builds no
  # archives (dist's pr-run-mode is plan), packages a build of its own made the
  # same way; a tag never does. Its artifact is named artifacts-*, so host
  # attaches it to the GitHub Release with the archives.
  deb:
    name: deb (${{ matrix.arch }})
    needs:
      - plan
      - build-local-artifacts
      - deb-assets
    # always(): build-local-artifacts is skipped on a pull request, which would
    # otherwise skip this job too.
    if: ${{ always() && needs.plan.result == 'success' && needs.deb-assets.result == 'success' && (needs.build-local-artifacts.result == 'success' || (needs.plan.outputs.publishing != 'true' && needs.build-local-artifacts.result == 'skipped')) }}
    strategy:
      fail-fast: false
      # The runner of each target is dist-workspace.toml's; a test holds the two
      # (and deb-install's) in step.
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Attests the packages (Sigstore through the OIDC token).
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain, the musl target, musl-tools and lintian
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install --profile minimal
          rustup target add "$TARGET"
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q musl-tools lintian
      - name: Install cargo-deb, cargo-auditable and just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deb@${{ env.CARGO_DEB_VERSION }},cargo-auditable@${{ env.CARGO_AUDITABLE_VERSION }},just@${{ env.JUST_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-assets
          path: target/deb-assets/
      - name: Fetch the release archive
        if: ${{ needs.build-local-artifacts.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*${{ matrix.target }}*
          path: target/distrib/
          merge-multiple: true
      - name: Unpack the release binary
        id: binary
        if: ${{ needs.build-local-artifacts.result == 'success' }}
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find target/distrib -maxdepth 1 -type f -name "duscope-$TARGET.tar.*" ! -name '*.sha256')
          (( ${#archives[@]} == 1 )) || { echo "::error::expected one archive for $TARGET in target/distrib, found ${#archives[@]}"; exit 1; }
          mkdir -p target/release-binary
          tar -xf "${archives[0]}" -C target/release-binary
          mapfile -t binaries < <(find target/release-binary -type f -name duscope)
          (( ${#binaries[@]} == 1 )) || { echo "::error::expected one duscope in ${archives[0]}, found ${#binaries[@]}"; exit 1; }
          echo "path=${binaries[0]}" >> "$GITHUB_OUTPUT"
      - name: Use the reproducible build environment
        run: just repro-env target | tee -a "$GITHUB_ENV"
      - name: Build the package
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ steps.binary.outputs.path }}
        run: just deb "$TARGET" "$BINARY" reuse
      - name: Lintian
        # initial-upload-closes-no-bugs fires while debian/changelog has a single
        # entry (before the first release after v0.0.1); the package is not
        # uploaded to Debian, so there is no bug to close.
        run: lintian --fail-on error,warning --display-info --suppress-tags initial-upload-closes-no-bugs target/debian/*.deb
      - name: Attest
        if: ${{ needs.plan.outputs.publishing == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "target/debian/*.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  # Each package installed with apt in a clean Debian 12 and Ubuntu 22.04, where
  # it runs, and carries the man page and completions this build prints.
  deb-install:
    name: deb-install (${{ matrix.image }}, ${{ matrix.arch }})
    needs:
      - plan
      - deb
    # always(): on a pull request a job above deb is skipped, which would skip
    # this one too; it runs when deb succeeded.
    if: ${{ always() && needs.plan.result == 'success' && needs.deb.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-deb-${{ matrix.arch }}
          path: debs/
      - name: Install and run
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Ubuntu's container image leaves man pages out; a real system has them.
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          apt-get update -q
          apt-get install -y -q ./debs/duscope_*.deb
          duscope top /usr --json > top.json
          grep -q '"ok":true' top.json
          zcat /usr/share/man/man1/duscope.1.gz | cmp - <(duscope man)
          cmp /usr/share/bash-completion/completions/duscope <(duscope completions bash)
          cmp /usr/share/zsh/vendor-completions/_duscope <(duscope completions zsh)
          cmp /usr/share/fish/vendor_completions.d/duscope.fish <(duscope completions fish)
          echo "$(. /etc/os-release && echo "$PRETTY_NAME"): duscope $(dpkg-query -W -f='${Version}' duscope) installs and runs"

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - deb-install
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    # and the .debs built and installed: deb-install runs whenever publishing is, so
    # "skipped" there means a job it needs failed, and the release waits for a fix.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') && needs.deb-install.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    # Creates the GitHub Release.
    permissions:
      contents: write
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  # Publish the crates to crates.io after the GitHub Release, each crate after the
  # crates it depends on. A rerun skips the versions already published.
  publish-crates:
    needs:
      - plan
      - host
    runs-on: "ubuntu-24.04"
    # Six crates, each of which may wait three minutes for the index (one in cargo
    # publish, two in the loop below): as long again for building and uploading.
    timeout-minutes: 40
    # crates.io trusted publishing (DEV-22): the job's OIDC token buys a crates.io
    # token that lives 30 minutes and is revoked when the job ends. The index
    # waits are held to 18 minutes so the last upload falls within it; a run that
    # outlives it anyway is re-run, and versions already published are skipped.
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=${TAG#v}
          # Whether crates.io's sparse index lists the version (names of four or more
          # characters live at /<first two>/<next two>/<name>).
          published() {
            curl --proto '=https' --tlsv1.2 -fsS "https://index.crates.io/${1:0:2}/${1:2:2}/$1" 2>/dev/null |
              grep -q "\"vers\":\"$2\""
          }
          for crate in duscope-walk duscope-core duscope-treemap duscope-tui duscope-mcp duscope; do
            if published "$crate" "$version"; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
            # cargo publish waits for the index too, but gives up after a minute; two
            # more here, as all six crates exist and the index is seconds behind.
            for _ in $(seq 24); do published "$crate" "$version" && break; sleep 5; done
            published "$crate" "$version" || { echo "::error::$crate $version did not reach the crates.io index"; exit 1; }
          done

  # The tap's version bump (P1-PKG-02): brew bump-formula-pr points the formula at
  # the tag's source archive and opens the pull request in kawadeomkar/homebrew-tap,
  # whose tests.yml builds the bottles and publish.yml merges them (the tap has no
  # autobump.yml, so the two never race). The first release finds no formula to
  # bump and opens packaging/homebrew/duscope.rb as the pull request instead, so it
  # gets its bottles the same way. Not for a pre-release. A re-run of the release
  # finds the formula at the tag, or its pull request open, and stops there
  # without opening another.
  homebrew:
    needs:
      - plan
      - host
    if: ${{ needs.plan.outputs.publishing == 'true' && !fromJson(needs.host.outputs.val).announcement_is_prerelease }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open the version-bump pull request in the tap
        env:
          # Reads and opens the tap's pull requests and pushes the first
          # release's branch, which the tap token may.
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=${TAG#v}
          url="https://github.com/kawadeomkar/duscope/archive/refs/tags/$TAG.tar.gz"
          brew tap kawadeomkar/tap
          tap="$(brew --repository kawadeomkar/tap)"
          formula="$tap/Formula/duscope.rb"
          if [[ -f $formula ]] && grep -qF "\"$url\"" "$formula"; then
            echo "::notice::the tap's formula is already at $TAG"
            exit 0
          fi
          # bump-formula-pr pushes the branch bump-duscope-<version>, and the
          # first release's pull request takes the same name; a second run
          # would fail on the duplicate pull request and the existing branch.
          open=$(gh pr list --repo kawadeomkar/homebrew-tap --state open --head "bump-duscope-$version" --json url --jq '.[0].url // empty')
          if [[ -n $open ]]; then
            echo "::notice::the tap's pull request for $TAG is already open: $open"
            exit 0
          fi
          if [[ ! -f $formula ]]; then
            # The first release: no formula to bump, so this repository's goes
            # in as the pull request, with the tag's archive and its checksum.
            sha256=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
            git -C "$tap" switch -c "bump-duscope-$version"
            mkdir -p "$tap/Formula"
            sed -e "s|@URL@|$url|" -e "s|@SHA256@|$sha256|" packaging/homebrew/duscope.rb > "$formula"
            git -C "$tap" add Formula/duscope.rb
            git -C "$tap" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "duscope $version (new formula)"
            # The tap token pushes the branch, as bump-formula-pr's does.
            gh auth setup-git
            git -C "$tap" push origin "bump-duscope-$version"
            gh pr create --repo kawadeomkar/homebrew-tap --base main --head "bump-duscope-$version" \
              --title "duscope $version (new formula)" \
              --body "The duscope formula, from packaging/homebrew/duscope.rb at $TAG."
            exit 0
          fi
          # --no-fork: the token may push a branch to the tap and open the pull
          # request there, and cannot create a fork (docs/RELEASING.md, Secrets).
          brew bump-formula-pr --no-browse --no-audit --no-fork --url "$url" kawadeomkar/tap/duscope

  announce:
    needs:
      - plan
      - host
      - publish-crates
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-crates.result == 'skipped' || needs.publish-crates.result == 'success') }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
