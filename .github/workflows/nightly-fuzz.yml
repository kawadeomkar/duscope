# duscope's nightly fuzzing (plan/SPEC.md P2-TEST-01).
#
# Each target of fuzz/Cargo.toml runs for ten minutes (`just fuzz <target> 600`),
# on the dated nightly toolchain the justfile pins, on GitHub's ubuntu-24.04
# runners. ci.yml's fuzz-smoke runs the same targets for 60 s on every pull
# request; crates/duscope-core/tests/fuzz_workflows.rs keeps the two lists and
# fuzz/Cargo.toml the same.
#
# Each target's corpus is kept between runs in the Actions cache, so a night
# starts where the last one stopped; it is never committed (fuzz/.gitignore).
#
# A crash, leak, timeout or out-of-memory input fails its job, which uploads the
# input as the artifact `crash-<target>`. The report job then files it as an
# issue labelled `fuzz`, the input in base64 in its body with the command that
# reproduces it, or comments on the open issue of that target. The fuzzing
# jobs keep a read-only token; only the report job may write issues.

name: Nightly fuzz

on:
  schedule:
    # 04:47 UTC, off the hour, when GitHub delays scheduled runs most, and
    # after nightly-bench.yml's start.
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # As ci.yml installs it.
  JUST_VERSION: "1.59.0"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Every target of fuzz/Cargo.toml, as ci.yml's fuzz-smoke runs them.
        target: [sql, ncdu, gdu, gpscan, args]
    runs-on: ubuntu-24.04
    # Ten minutes of fuzzing, a cold build of the target and cargo-fuzz's.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      # Before cargo-fuzz's install: the cache holds ~/.cargo/bin, so a cached
      # cargo-fuzz of the pinned version is not built again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: nightly-${{ matrix.target }}
      - name: Install the dated nightly toolchain and cargo-fuzz pinned in the justfile
        run: |
          nightly=$(just --evaluate fuzz_toolchain)
          rustup toolchain install "$nightly" --profile minimal
          rustup run "$nightly" rustc --version
          cargo install --locked "cargo-fuzz@$(just --evaluate cargo_fuzz_version)"
      - name: Restore the corpus
        # The newest earlier corpus of the target.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: just fuzz ${{ matrix.target }} (ten minutes)
        id: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: just fuzz "$TARGET" 600
      - name: Save the corpus
        # Under a key of its own each run, and on a failing night too: what
        # the night grew is kept either way.
        if: ${{ always() && steps.fuzz.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  report:
    needs: fuzz
    if: ${{ always() && needs.fuzz.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crash-*
          path: crashes
      - name: File each crash as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          # The body holds at most 64 KiB: 36 KiB of input is 48 KiB of base64.
          max=36864
          gh label create fuzz --color B60205 --force \
            --description "A crash nightly-fuzz.yml found; it blocks the next release"
          for dir in crashes/crash-*/; do
            target=${dir#crashes/crash-}
            target=${target%/}
            inputs=("$dir"*)
            ((${#inputs[@]})) || continue
            input=${inputs[0]}
            name=$(basename "$input")
            size=$(stat -c %s "$input")
            body=$(mktemp)
            {
              echo "nightly-fuzz.yml found an input that fails the \`$target\` fuzz target in $RUN_URL (artifact \`crash-$target\`, ${#inputs[@]} input(s))."
              echo
              echo "\`$name\`, $size bytes, in base64:"
              echo
              echo '```'
              head -c "$max" "$input" | base64 -w 76
              echo '```'
              if ((size > max)); then
                echo
                echo "These are its first $max bytes; the artifact holds it whole."
              fi
              echo
              echo "To reproduce it, decode it into \`fuzz/artifacts/$target/$name\` (\`base64 -d\`) and run:"
              echo
              echo '```sh'
              echo "cd fuzz && cargo +\"\$(just --evaluate fuzz_toolchain)\" fuzz run $target artifacts/$target/$name"
              echo '```'
            } > "$body"
            title="nightly-fuzz: the $target target fails"
            open=$(gh issue list --state open --label fuzz --search "\"$title\" in:title" \
              --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [[ -n $open ]]; then
              gh issue comment "$open" --body-file "$body"
              echo "commented on #$open: $title"
            else
              gh issue create --title "$title" --label fuzz --body-file "$body"
            fi
          done
