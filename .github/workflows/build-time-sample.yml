# Temporary, on this branch only (never merged): the build-time job's cold
# release build on the shared ubuntu-24.04 runners with the bundled SQLite
# compiled at -O3 (cc's default for the release profile), -O2 and -Os, with
# cargo's timings to show the critical path (P2-IDX-02).
name: Build-time sample (temporary)

on:
  push:
    branches: [p1-bench-03-allocator-build]

permissions:
  contents: read

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        opt: [O3, O2, Os]
        n: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - name: Fetch dependencies (not timed)
        run: cargo fetch --locked
      - name: Two cold release builds
        env:
          OPT: ${{ matrix.opt }}
        run: |
          # The host target's C flags reach SQLite alone: mimalloc is built
          # for musl only.
          if [[ $OPT != O3 ]]; then export CFLAGS_x86_64_unknown_linux_gnu="-$OPT"; fi
          cpu=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n1)
          for i in 1 2; do
            cargo clean
            start=$(date +%s.%N)
            cargo build --release --locked --offline -p duscope --timings
            end=$(date +%s.%N)
            secs=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.1f", e - s }')
            sqlite=$(python3 - <<'PY'
          import json, re, glob
          html = open(sorted(glob.glob("target/cargo-timings/cargo-timing*.html"))[-1]).read()
          data = json.loads(re.search(r"const UNIT_DATA = (\[.*?\]);", html, re.S).group(1))
          run = [u for u in data if u["name"] == "libsqlite3-sys" and "run" in u.get("target", "")]
          print(f'{run[0]["duration"]:.1f}' if run else "?")
          PY
            )
            size=$(stat -c %s target/release/duscope)
            echo "SAMPLE ${OPT} ${secs} sqlite-build-script ${sqlite} size ${size} | ${cpu} | $(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
