# Temporary, on this branch only (never merged): cold release builds of main
# (cc06004, the index in duscope-core) and of a spike with the index in its own
# crate, on the shared ubuntu-24.04 runners, with cargo's timings per unit.
name: Build-time sample (temporary)

on:
  push:
    branches: [p1-bench-03-allocator-build]

permissions:
  contents: read

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        variant: [main-Os, split-Os, split-O3]
        n: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ startsWith(matrix.variant, 'main') && 'cc06004f458a66cc9343998d452cee3ccbd7da49' || 'cef1ede5d0bba743a6a5fc0e3dc210e6f6b023c3' }}
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - name: Fetch dependencies (not timed)
        run: cargo fetch --locked
      - name: Two cold release builds
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          # .cargo/config.toml sets -Os for this target; the environment wins.
          if [[ $VARIANT == *-O3 ]]; then export CFLAGS_x86_64_unknown_linux_gnu="-O3"; fi
          cpu=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n1)
          for i in 1 2; do
            cargo clean
            start=$(date +%s.%N)
            cargo build --release --locked --offline -p duscope --timings
            end=$(date +%s.%N)
            secs=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.1f", e - s }')
            units=$(python3 - <<'PY'
          import json, re, glob
          html = open(sorted(glob.glob("target/cargo-timings/cargo-timing*.html"))[-1]).read()
          data = json.loads(re.search(r"const UNIT_DATA = (\[.*?\]);", html, re.S).group(1))
          want = ["libsqlite3-sys", "rusqlite", "duscope-walk", "duscope-core", "duscope-index", "duscope-treemap", "duscope-tui", "duscope-mcp", "duscope"]
          out = []
          for name in want:
              for u in data:
                  if u["name"] == name and (name != "libsqlite3-sys" or "run" in u.get("target", "")) and "build script" not in u.get("target", "").replace("(run)", ""):
                      out.append(f'{name}={u["start"]:.1f}+{u["duration"]:.1f}')
                      break
          print(" ".join(out))
          PY
            )
            echo "SAMPLE ${VARIANT} ${secs} | ${cpu} | ${units}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
