# duscope CI: the merge gate for every pull request (plan/SPEC.md "CI/CD", P0-CI-01).
#
# Budget: 20 minutes per job, enforced by `timeout-minutes: 20` on every job but
# `checks (macos-26)`, which has 30 (DEV-141), and
# `platform (macos-26)`, which has 30 (DEV-169); the target is under 10 minutes
# of wall time per job.
#
# The jobs run the justfile recipes developers run (`just fmt`, `just clippy`,
# `just test`, `just docs`, `just deny`, `just size`, `just repro`), so a green
# `just check` locally and a green CI mean the same thing. Tools are installed as
# prebuilt binaries at the versions the justfile pins; every third-party action
# is pinned to a full commit SHA with its version in a comment.
#
# Required checks (branch protection on main, applied from docs/github-settings.md):
# fmt; clippy, test (default and locale legs), platform and bench-regression on
# ubuntu-24.04 and ubuntu-24.04-arm; checks (macos-26), which is macOS's clippy
# and both test legs, and platform and bench-regression on macos-26; msrv (pinned)
# and msrv (stable); deny; fuzz-smoke for each fuzz target; mcp-conformance on
# ubuntu-24.04 and macos-26; docs; schemas; size on macos-26 and ubuntu-24.04,
# and size-comment; build-time; repro; pixels on macos-26 and ubuntu-24.04;
# changelog. Not required: intel-mac (best effort), quick, and mcp-smoke, which
# runs on the schedule and a dispatch alone.
#
# Scope (DEV-73): a stack of pull requests runs every job of each of them again
# at each push, and a macOS runner is the scarce one (five at a time on this
# account, of twenty jobs). The full set runs where it decides a merge: a pull
# request into main, a push to main, the schedule, a dispatch, and a pull
# request labelled `full-ci`, which the top of a stack carries, since it holds
# the whole stack's code. GitHub's stacked pull requests run as if into main:
# for the pull requests of a stack it recognises, github.base_ref reads main
# and main's protection applies, so they run the full set too. Any other pull
# request into another branch runs fmt, deny, changelog and quick (clippy and
# the tests on ubuntu-24.04, in one job): no branch protection applies to it,
# and branch protection requires it to be updated with main before it merges,
# which runs the full set on its new head. intel-mac runs on pushes to main,
# the schedule and a dispatch.

name: CI

on:
  pull_request:
    # labeled/unlabeled let the `no-changelog` label re-evaluate the changelog
    # check. The whole workflow reruns on those events: a job skipped by `if:`
    # reports success, and would mask a failed check from the run before it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    # Daily on main: catches toolchain drift (the msrv stable leg) and registry
    # drift (the advisory database, web links) without a push, and makes "green
    # for seven days" measurable.
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its running CI. Every other run (a push
  # to main, the schedule, a dispatch) has a group of its own commit: GitHub keeps
  # only the newest waiting run of a group, so a group per ref would skip a commit
  # that reached main while two runs were ahead of it.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The task runner every job uses (the justfile pins the cargo tools, not just itself).
  JUST_VERSION: "1.59.0"
  # The benchmark runner bench-regression drives, as `just setup` pins it.
  HYPERFINE_VERSION: "2.0.0"
  # The markdown link checker of the docs job, verified against this checksum.
  LYCHEE_VERSION: "0.24.2"
  LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
  # The cold release build's ceiling in seconds, one for every CPU model of
  # the shared ubuntu-24.04 runners (P0-CI-03). Until then each model had a
  # budget of its own, its slowest cold build plus 10% under a 90 s ceiling
  # (DEV-59, DEV-62, DEV-129), and three of the six models sat at the 89 s cap
  # (EPYC 7763, Xeon Platinum 8370C and Xeon Platinum 8573C, whose slowest
  # builds seen were 84.8 to 90.9 s). The ceiling is re-based once to 120 s
  # and the per-model ratchet ends: the job reports the measured time and the
  # CPU model in its step summary and fails only over the ceiling, and
  # packages report their build time and do not re-derive it. A build over it
  # is measured once more before the job fails (DEV-53). The size budget lives
  # in the justfile as size_budget.
  BUILD_TIME_BUDGET_SECS: "120"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just fmt

  quick:
    # A pull request into another branch than main, the middle of a stack
    # (DEV-73, above): clippy and the tests on ubuntu-24.04 in one job. The full
    # set runs on its new head once it is updated with main, and on a pull
    # request labelled full-ci.
    name: quick (ubuntu-24.04)
    if: github.event_name == 'pull_request' && github.base_ref != 'main' && !contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - name: Install zsh, fish, mandoc, ncdu and xmllint
        # P1-CLI-04's tests load the completions in zsh and fish and lint the man
        # page with mandoc, P2-CLI-02's reads an export back with ncdu, and
        # P2-MAP-01's reads an SVG with xmllint; in CI a missing one fails them.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq zsh fish mandoc ncdu libxml2-utils
      - run: just clippy
      - run: just test

  clippy:
    name: clippy (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - run: just clippy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.leg }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # default: the runner's environment. locale: TZ=America/Los_Angeles and
        # LC_ALL=fr_FR.UTF-8, which the testkit must shield every test from.
        leg: [default, locale]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - name: Generate the fr_FR.UTF-8 locale
        if: matrix.leg == 'locale' && runner.os == 'Linux'
        run: sudo locale-gen fr_FR.UTF-8
      - name: Install zsh, fish, mandoc, ncdu and xmllint
        # P1-CLI-04's tests load the completions in zsh and fish and lint the man
        # page with mandoc, P2-CLI-02's reads an export back with ncdu, and
        # P2-MAP-01's reads an SVG with xmllint; in CI a missing one fails them.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq zsh fish mandoc ncdu libxml2-utils
      - name: just test
        if: matrix.leg == 'default'
        run: just test
      - name: just test under TZ=America/Los_Angeles LC_ALL=fr_FR.UTF-8
        if: matrix.leg == 'locale'
        env:
          TZ: America/Los_Angeles
          LC_ALL: fr_FR.UTF-8
        run: |
          # Not `locale -a | grep -q`: grep exits at the first match, and macOS's
          # locale then fails to flush, which pipefail reports as a failure.
          locales=$(locale -a)
          grep -Eiq '^fr_FR\.utf-?8$' <<<"$locales" || { echo "::error::fr_FR.UTF-8 is not available on this runner"; exit 1; }
          date
          just test
      # A golden test that failed leaves this runner's goldens, regenerated, as an
      # artifact: the copies for an OS the author does not have at hand
      # (duscope/tests/golden/README.md).
      - name: Regenerate the goldens after a failure
        if: failure() && matrix.leg == 'default'
        run: just golden || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.leg == 'default'
        with:
          name: goldens-${{ matrix.os }}
          path: duscope/tests/golden/
          retention-days: 14
      # The fixture tree (P0-TEST-01) is built in this job by the tests that use it,
      # and not cached between runs: actions/cache's tar archive would restore its
      # sparse files fully allocated, its clones as copies and its compressed files
      # uncompressed, and drop its socket, so a restored tree would not be the tree
      # its record describes. The du parity tests on the fixture tree run here.

  platform:
    # The tests that mount filesystems (loop devices, tmpfs, bind mounts, an exFAT
    # image), attach disk images and scan the real / on macOS: ignored by default
    # and run as root here (P1-TEST-01), by name, through `just platform-tests`,
    # the recipe `just check-full` runs. The system-tree du parity and the bench
    # trees' RSS run in nightly-bench.yml, on the bench runners, not on pull
    # requests.
    name: platform (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # 30 minutes on macOS, 20 on Linux (DEV-169). On `main` at e479ae6 the macOS
    # leg's tests took 19.6 minutes: the build 7, P5-CORE-01's incremental rescan
    # of the fixture tree on an image 6, the scan of / 4.5; its tests passed and
    # the job was cancelled at 20 minutes saving its cache. The Linux legs take 4
    # to 6 minutes.
    timeout-minutes: ${{ matrix.os == 'macos-26' && 30 || 20 }}
    # Optimised as release is, for the scan of /, without release's thin LTO
    # and single codegen unit: over the ~90 test binaries the recipe builds,
    # those took the macOS job to its 20-minute budget (a cold `cargo test
    # --release --workspace --no-run` at -j3: 7 min 46 s with them, 2 min 0 s
    # without).
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the filesystems' tools
        if: runner.os == 'Linux'
        run: |
          # mkfs for the exFAT, FAT, btrfs, XFS and NTFS images, mksquashfs for
          # the read-only one (P5-WALK-02), and the kernel's extra modules,
          # which hold ntfs3 and exfat on Ubuntu's generic kernel. The runners'
          # Azure kernel has no extra package: its base modules package holds
          # btrfs, xfs, exfat, ntfs3 and overlay, and vfat and squashfs are
          # built in.
          sudo apt-get update -q
          sudo apt-get install -y -q exfatprogs dosfstools btrfs-progs xfsprogs ntfs-3g squashfs-tools
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra package for $(uname -r)"
      - name: Probe the kernel's filesystems
        if: runner.os == 'Linux'
        run: |
          # Each filesystem the platform tests mount, loaded if it is a module.
          # One the kernel has no driver for is named in a warning here and in
          # DUSCOPE_TEST_MISSING_FS, and the part of a test that mounts it
          # skips; a mount that fails for any other reason fails its test
          # (DEV-58).
          missing=()
          for fs in btrfs xfs exfat vfat ntfs3 squashfs overlay; do
            grep -qw "$fs" /proc/filesystems || sudo modprobe -q "$fs" || true
            if grep -qw "$fs" /proc/filesystems; then
              echo "$fs: the kernel has a driver"
            else
              missing+=("$fs")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::warning title=Filesystems missing::kernel $(uname -r) has no driver for ${missing[*]}: the platform tests' parts that mount them skip"
            echo "DUSCOPE_TEST_MISSING_FS=${missing[*]}" >> "$GITHUB_ENV"
          fi
      - name: The platform tests, as root
        run: |
          # Built as the runner's user; each test binary runs under sudo, which
          # mounting needs, keeping the environment the testkit reads.
          host=$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${host}_RUNNER=sudo -E"
          just platform-tests

  checks:
    # macOS's clippy and both legs of its tests in one job (DEV-73): a macOS
    # runner is the scarce one, and as three jobs each waited for one, then
    # paid for its own checkout and cache, and the locale leg built the tests
    # again. Each step runs whatever failed before it, so one run reports
    # every failure. The platform tests stay a job of their own: on macOS their
    # release build and root runs take about 20 minutes (DEV-169). Clippy and
    # the two legs took 17 to 20 minutes by November 2026 and twice ran into the
    # 20-minute budget, so the locale leg leaves out the fixture tree's timed
    # rebuild, which reads no locale (`just test-locale`), and the job has 30
    # minutes (DEV-141).
    name: checks (macos-26)
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - name: Install bash 4 or later and fish
        # macOS ships bash 3.2, and the test that runs the changelog job needs 4 or
        # later; `just setup` installs it the same way. fish loads the completions
        # in P1-CLI-04's test (macOS ships zsh and mandoc).
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install bash fish
          "$(brew --prefix)/bin/bash" --version
      - name: just clippy
        run: just clippy
      - name: just test
        id: test
        if: ${{ !cancelled() }}
        run: just test
      - name: just test under TZ=America/Los_Angeles LC_ALL=fr_FR.UTF-8
        if: ${{ !cancelled() }}
        env:
          TZ: America/Los_Angeles
          LC_ALL: fr_FR.UTF-8
        run: |
          # Not `locale -a | grep -q`: grep exits at the first match, and macOS's
          # locale then fails to flush, which pipefail reports as a failure.
          locales=$(locale -a)
          grep -Eiq '^fr_FR\.utf-?8$' <<<"$locales" || { echo "::error::fr_FR.UTF-8 is not available on this runner"; exit 1; }
          date
          just test-locale
      - name: Regenerate the goldens after a failure
        if: failure() && steps.test.outcome == 'failure'
        run: just golden || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.test.outcome == 'failure'
        with:
          name: goldens-macos-26
          path: duscope/tests/golden/
          retention-days: 14

  bench-regression:
    # The harness on T1 against this job's results on pushes to main (DEV-20,
    # bench/compare.py): duscope's p50 and its ratio to diskus, each against the
    # last five results from the same CPU model. The shared runners come with
    # several, and the ratio differs between them as the time does (on
    # ubuntu-24.04, 0.51 on one model and 0.60 to 0.67 on another). A regression
    # beyond 15% fails only when a second measurement reproduces it. main keeps its
    # result whatever the comparison says, so a slowdown merged on purpose fails
    # pull requests only until main's own results make up most of each CPU model's
    # five.
    name: bench-regression (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Reading the result files earlier runs on main left as artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: hyperfine@${{ env.HYPERFINE_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build duscope
        run: cargo build --release --locked -p duscope
      - name: Measure T1
        id: measure
        run: |
          file=$(bench/run.sh run --subject duscope --tool-path "duscope=$PWD/target/release/duscope" \
            --trees T1 --competitors diskus --mode warm \
            --trees-dir "$RUNNER_TEMP/trees" --tools-dir "$RUNNER_TEMP/tools" --results-dir "$RUNNER_TEMP/results")
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Fetch the baselines
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
        run: |
          base="$RUNNER_TEMP/baselines"
          mkdir -p "$base"
          # This job's result files from the last 30 pushes to main that kept one,
          # whatever else in those runs failed: enough for compare.py to find five
          # from this run's CPU model among the shared runners' several. Only
          # pushes: a pull request from a fork's branch named main is a
          # pull_request run, never a push to this main.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status completed --limit 30 --json databaseId --jq '.[].databaseId')
          found=0
          for id in $ids; do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "bench-regression-$OS" \
              --dir "$base/$id" 2>/dev/null; then
              found=$((found + 1))
            fi
          done
          echo "$found baseline result(s) from main"
      - name: Compare with main
        env:
          FILE: ${{ steps.measure.outputs.file }}
        run: |
          shopt -s nullglob
          baselines=("$RUNNER_TEMP"/baselines/*/)
          compare() {
            python3 bench/compare.py "$1" "${baselines[@]}" --tree T1 --last 5 --tolerance 0.15
          }
          status=0
          compare "$FILE" || status=$?
          if (( status == 1 )); then
            echo "::warning title=bench-regression::beyond 15% on the first measurement; measuring again"
            again=$(bench/run.sh run --subject duscope --tool-path "duscope=$PWD/target/release/duscope" \
              --trees T1 --competitors diskus --mode warm \
              --trees-dir "$RUNNER_TEMP/trees" --tools-dir "$RUNNER_TEMP/tools" \
              --out "$RUNNER_TEMP/results/again.json")
            status=0
            compare "$again" || status=$?
          fi
          exit "$status"
      # A push to main keeps its result as a baseline for the pull requests after it,
      # even when the comparison failed: main's speed is what later changes answer to.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.measure.outputs.file != '' }}
        with:
          name: bench-regression-${{ matrix.os }}
          path: ${{ steps.measure.outputs.file }}
          if-no-files-found: error
          retention-days: 90

  msrv:
    name: msrv (${{ matrix.toolchain }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        # pinned: rust-toolchain.toml, which must name the workspace rust-version
        # (1.89). stable: the newest release, built and tested without clippy.
        toolchain: [pinned, stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the ${{ matrix.toolchain }} toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [[ $TOOLCHAIN == stable ]]; then
            rustup toolchain install stable --profile minimal
            echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
            rustup run stable rustc --version
          else
            rustup toolchain install --profile minimal
            channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
            msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
            version=$(rustc --version)
            echo "$version (rust-toolchain.toml: $channel, rust-version: $msrv)"
            [[ -n $msrv && $channel == "$msrv" && $version == "rustc $msrv."* ]] || {
              echo "::error::the pinned toolchain must be the MSRV exactly: rust-toolchain.toml says '$channel', Cargo.toml rust-version says '$msrv', rustc says '$version'"
              exit 1
            }
          fi
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install zsh, fish, mandoc, ncdu and xmllint
        # As in the test job: P1-CLI-04's, P2-CLI-02's and P2-MAP-01's tests need
        # them in CI.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq zsh fish mandoc ncdu libxml2-utils
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - run: just test

  pixels:
    # The `pixels` feature (P4-TUI-07), which no build the project ships turns
    # on: `just pixels` on the feature's own toolchain, the justfile's
    # pixels_toolchain (1.90, which ratatui-image's Sixel encoder needs, past
    # the pinned 1.89). Clippy over duscope-treemap, the one crate with code
    # behind the feature; the binary built with it; and the tests that run the
    # probe against mocked terminals, termlens answering as a Kitty graphics
    # terminal, a Sixel one, iTerm2, one with neither, and one that answers
    # nothing, and that leave it out inside tmux. It runs on both platforms, as
    # every change builds and tests on both. The default build's answer to
    # --treemap pixels, not_compiled, is a test of the test jobs.
    name: pixels (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install the pixels feature's toolchain, as the justfile pins it
        # RUSTUP_TOOLCHAIN in place of rust-toolchain.toml's 1.89 for every
        # cargo and rustc of the job, the cache's key included.
        run: |
          toolchain=$(just --evaluate pixels_toolchain)
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustup run "$toolchain" rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pixels
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just pixels

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Read the cargo-deny version pinned in the justfile
        id: pins
        run: echo "cargo_deny=$(just --evaluate cargo_deny_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@${{ steps.pins.outputs.cargo_deny }}
      - name: just deny advisories licenses bans sources
        run: just deny advisories licenses bans sources

  fuzz-smoke:
    name: fuzz-smoke (${{ matrix.target }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        # Every target of fuzz/Cargo.toml, as nightly-fuzz.yml runs them
        # (crates/duscope-core/tests/fuzz_workflows.rs checks both lists).
        target: [sql, ncdu, gdu, gpscan, args, jsonrpc, index_rows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      # Before cargo-fuzz's install: the cache holds ~/.cargo/bin, so a cached
      # cargo-fuzz of the pinned version is not built again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the dated nightly toolchain and cargo-fuzz pinned in the justfile
        run: |
          nightly=$(just --evaluate fuzz_toolchain)
          rustup toolchain install "$nightly" --profile minimal
          rustup run "$nightly" rustc --version
          # Built with the nightly: cargo-fuzz's locked dependencies need a
          # newer rustc than the pinned 1.89 (`just setup` builds it with stable).
          cargo +"$nightly" install --locked "cargo-fuzz@$(just --evaluate cargo_fuzz_version)"
      - name: Start from the nightly corpus
        # Read only: nightly-fuzz.yml grows the corpus on main, and a pull
        # request may read main's caches.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-none
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: just fuzz ${{ matrix.target }} (60 s)
        env:
          TARGET: ${{ matrix.target }}
        run: just fuzz "$TARGET" 60
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  mcp-conformance:
    # rmcp's client, the conformance oracle (D36), against `duscope mcp` on
    # both first-class platforms (P3-MCP-06): duscope-mcp's tests, among them
    # crates/duscope-mcp/tests/conformance.rs, which starts the binary built
    # first here and drives it through rmcp's client in both protocol
    # revisions, and the smoke scripts' dry runs. The oracle's version, which
    # schemas/mcp/MAPPING.md records, goes to the log and the summary as
    # Cargo.lock resolves it.
    name: mcp-conformance (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - name: The conformance oracle
        run: |
          oracle=$(cargo tree --locked -p duscope-mcp --edges dev --invert rmcp --depth 0 --prefix none)
          [[ -n $oracle ]] || { echo "::error title=mcp-conformance::duscope-mcp has no rmcp dev-dependency"; exit 1; }
          echo "conformance oracle: $oracle" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build duscope, which the suite starts
        run: cargo build --locked -p duscope
      - name: rmcp's client against duscope mcp
        run: cargo test --locked -p duscope-mcp

  docs:
    name: docs
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: just docs (rustdoc with warnings denied)
        run: just docs
      - name: Install lychee
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Markdown links in README.md and docs/
        env:
          # lychee uses it against GitHub's rate limit on the daily web-link run.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=()
          [[ -f README.md ]] && files+=(README.md)
          files+=(docs/**/*.md)
          if (( ${#files[@]} == 0 )); then
            echo "::notice title=docs::no README.md or docs/*.md yet, so the link check is skipped"
            exit 0
          fi
          # Pull requests and pushes check relative links and anchors offline, so a
          # remote site's outage cannot block a merge; the daily run checks web links too.
          offline=(--offline)
          [[ $GITHUB_EVENT_NAME == schedule ]] && offline=()
          lychee --version
          lychee --no-progress --include-fragments --root-dir "$GITHUB_WORKSPACE" "${offline[@]}" "${files[@]}"
      # Added by later packages:
      # - name: duscope man renders                  # P1: `duscope man | mandoc -T lint` is clean
      # - name: Envelope fixtures validate          # P2: `duscope schema --envelope <verb>` against JSON Schema 2020-12

  schemas:
    name: schemas
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      # The drift test is a unit test of duscope-core: the envelope types derive
      # schemars::JsonSchema only under cfg(test), which keeps schemars out of the
      # binary, and cfg(test) does not reach the library an integration test links.
      - name: The files under schemas/ equal the schemas derived from their types (x-* stripped)
        run: |
          count=$(cargo test --locked -p duscope-core --lib -- --list schema_drift:: | grep -c ': test$' || true)
          (( count > 0 )) || { echo "::error title=schemas::duscope-core has no schema_drift:: unit tests"; exit 1; }
          cargo test --locked -p duscope-core --lib -- schema_drift::
      - name: schemars and jsonschema stay dev-dependencies
        run: cargo test --locked -p duscope-core --test schema_drift
      - name: Every file passes JSON Schema 2020-12, with valid property names and $id
        run: cargo test --locked -p duscope --test schemas
      # Added by P2-CLI-01: every historical envelope golden validates against the current schema.

  size:
    name: size (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        # The two binaries the budget holds (the spec's arm64 macOS and x86_64
        # musl); the musl build also keeps the release targets linking.
        include:
          - os: macos-26
            key: macos
            target: ""
          - os: ubuntu-24.04
            key: ubuntu
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    outputs:
      macos: ${{ steps.size.outputs.macos }}
      ubuntu: ${{ steps.size.outputs.ubuntu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the musl target and musl-tools
        if: matrix.target != ''
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q musl-tools
      - name: just size
        id: size
        env:
          KEY: ${{ matrix.key }}
          OS: ${{ matrix.os }}
          TARGET: ${{ matrix.target }}
        run: |
          set +e
          just size "$TARGET" 2>&1 | tee "$RUNNER_TEMP/size.log"
          status=${PIPESTATUS[0]}
          set -e
          host=${TARGET:-$(rustc -vV | sed -n 's/^host: //p')}
          line=$(grep -m1 '^duscope: ' "$RUNNER_TEMP/size.log" || echo "no size reported")
          (( status == 0 )) || line="$line; FAILED (just size exited $status)"
          echo "$KEY=$line ($host)" >> "$GITHUB_OUTPUT"
          echo "$OS: $line ($host)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  size-comment:
    name: size-comment
    needs: size
    # Pull requests from this repository only: a fork's token cannot comment.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the size comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MACOS: ${{ needs.size.outputs.macos }}
          UBUNTU: ${{ needs.size.outputs.ubuntu }}
        run: |
          marker='<!-- duscope-size -->'
          body=$(cat <<EOF
          $marker
          **Release binary size** (\`just size\`, stripped, at ${HEAD_SHA:0:7})

          | Runner | Size |
          | --- | --- |
          | macos-26 | ${MACOS:-not reported} |
          | ubuntu-24.04 | ${UBUNTU:-not reported} |

          The budget is \`size_budget\` in the justfile.
          EOF
          )
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" --jq .html_url
          fi

  build-time:
    name: build-time
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      # No build cache: the build below must be cold. Downloads are not compile
      # time, so they happen first and the timed build runs offline.
      - name: Fetch dependencies (not timed)
        run: cargo fetch --locked
      # The shared runners come with several CPU models, whose cold builds of the
      # same code differ by a third. Every model is held to the one ceiling,
      # BUILD_TIME_BUDGET_SECS; the summary names the model beside the time, so
      # the trend still reads per model.
      - name: This machine's CPU model
        run: |
          cpu=$(sed -n 's/^model name[[:space:]]*: //p' "${DUSCOPE_TEST_CPUINFO:-/proc/cpuinfo}" \
            | head -n 1 | sed 's/[[:space:]]*$//')
          echo "cold build on ${cpu:-this CPU}, held to the ${BUILD_TIME_BUDGET_SECS} s ceiling" | tee -a "$GITHUB_STEP_SUMMARY"
      # `-p duscope`: the binary a user builds. The unpublished test members
      # (mktree, duscope-testkit) are not part of a release build. A build over
      # budget is measured again from cold and fails only when the second is over
      # too, as bench-regression measures again (DEV-53): that absorbs a moment's
      # noise on the runner, while the ceiling's margin absorbs a slower runner.
      - name: Cold cargo build --release
        run: |
          # Called as a command, not in $(...), so a failed build fails the step.
          cold_build() {
            start=$(date +%s.%N)
            cargo build --release --locked --offline -p duscope
            end=$(date +%s.%N)
            secs=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.1f", e - s }')
          }
          within() { awk -v t="$secs" -v b="$BUILD_TIME_BUDGET_SECS" 'BEGIN { exit !(t <= b) }'; }
          cold_build
          echo "cold cargo build --release: ${secs} s of the ${BUILD_TIME_BUDGET_SECS} s budget" | tee -a "$GITHUB_STEP_SUMMARY"
          within && exit 0
          echo "::warning title=build-time::the cold release build took ${secs} s, over the ${BUILD_TIME_BUDGET_SECS} s budget; building again from cold"
          cargo clean
          cold_build
          echo "cold cargo build --release, again: ${secs} s of the ${BUILD_TIME_BUDGET_SECS} s budget" | tee -a "$GITHUB_STEP_SUMMARY"
          within || {
            echo "::error title=build-time::the cold release build took ${secs} s on a second build too, over the ${BUILD_TIME_BUDGET_SECS} s budget"
            exit 1
          }

  repro:
    name: repro
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Fetch dependencies
        run: cargo fetch --locked
      # Two `just repro` builds into two target directories: the first is exactly what
      # a developer runs, the second runs from a copy of the checkout at another path
      # into a target directory with a longer name, so a path that escapes the
      # recipe's --remap-path-prefix shows up as a difference. No build cache: both
      # builds are cold.
      - name: Two just repro builds, compared
        run: |
          copy="$RUNNER_TEMP/duscope-copy"
          cp -a "$GITHUB_WORKSPACE" "$copy"
          just repro | tee "$RUNNER_TEMP/a.sha256"
          (cd "$copy" && just repro target/repro-second) | tee "$RUNNER_TEMP/b.sha256"
          a=$(awk '{ print $1 }' "$RUNNER_TEMP/a.sha256")
          b=$(awk '{ print $1 }' "$RUNNER_TEMP/b.sha256")
          if [[ -n $a && $a == "$b" ]] && cmp target/repro/release/duscope "$copy/target/repro-second/release/duscope"; then
            echo "repro: both builds are byte-identical, SHA-256 $a" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=repro::the two builds differ: $a versus $b"
            exit 1
          fi

  intel-mac:
    name: intel-mac
    # Best effort and not required: Intel macOS builds without the test suite,
    # on pushes to main, the schedule and a dispatch. Not on pull requests, where
    # it would take one of the five macOS runners (DEV-73).
    if: github.event_name != 'pull_request'
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked

  mcp-smoke:
    # Claude Code, Codex CLI and Gemini CLI each register `duscope mcp` with
    # the command its documentation gives and make three tool calls through
    # it (P3-MCP-06, crates/duscope-mcp/tests/smoke/). On the schedule and a
    # dispatch alone, never on a pull request, and not required: each run
    # pays the three vendors and waits on their uptime. Each client's step
    # gets its own key from the repository secrets (docs/RELEASING.md) and no
    # other step gets one; a key that is not set fails its step. Every step
    # runs whatever failed before it once the build has passed, and the three
    # logs are kept as an artifact, which the author commits beside the
    # scripts.
    name: mcp-smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build duscope
        id: build
        run: cargo build --release --locked -p duscope
      - name: Claude Code
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: crates/duscope-mcp/tests/smoke/claude-code.sh --duscope target/release/duscope --log-dir "$RUNNER_TEMP/mcp-smoke"
      - name: Codex CLI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: crates/duscope-mcp/tests/smoke/codex.sh --duscope target/release/duscope --log-dir "$RUNNER_TEMP/mcp-smoke"
      - name: Gemini CLI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: crates/duscope-mcp/tests/smoke/gemini.sh --duscope target/release/duscope --log-dir "$RUNNER_TEMP/mcp-smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mcp-smoke-logs
          path: ${{ runner.temp }}/mcp-smoke/
          if-no-files-found: ignore
          retention-days: 90

  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the merge of the pull request into main, HEAD^1 is main.
          fetch-depth: 2
      - name: A changelog.d/<ID>.md fragment that parses, or the no-changelog label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The title and labels are read live, so re-running this job picks up a
          # renamed title as well as a label added since the push.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          title=$(jq -r .title <<<"$pr")
          labelled=$(jq -r '[.labels[].name] | any(. == "no-changelog")' <<<"$pr")
          mapfile -t fragments < <(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- 'changelog.d/*.md' | grep -vx 'changelog.d/README.md' || true)

          # Every fragment the pull request adds or changes must parse. The rule
          # lives in scripts/changelog.py, whose `assemble` the REL: vX.Y.Z pull
          # request runs.
          status=0
          if (( ${#fragments[@]} )); then
            python3 scripts/changelog.py check "${fragments[@]}" || status=1
          fi

          if [[ $labelled == true ]]; then
            echo "::notice title=changelog::the no-changelog label is set, so no fragment is required"
            exit "$status"
          fi
          if [[ ! $title =~ ^([A-Z][A-Z0-9]*(-[A-Z0-9]+)*): ]]; then
            echo "::error title=changelog::the title '$title' does not start with '<ID>: ', so no fragment name can be derived; fix the title or ask the author for the no-changelog label"
            exit 1
          fi
          fragment="changelog.d/${BASH_REMATCH[1]}.md"
          if ! grep -qx "$fragment" <<<"$(printf '%s\n' "${fragments[@]}")"; then
            echo "::error title=changelog::add $fragment (keep-a-changelog lines under '### Added', '### Fixed', ...) or, when nothing is user-visible, ask the author for the no-changelog label"
            exit 1
          fi
          echo "changelog: $fragment found"
          exit "$status"
