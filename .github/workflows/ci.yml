# duscope CI: the merge gate for every pull request (plan/SPEC.md "CI/CD", P0-CI-01).
#
# Budget: 20 minutes per job, enforced by `timeout-minutes: 20` on every job; the
# target is under 10 minutes of wall time per job.
#
# The jobs run the justfile recipes developers run (`just fmt`, `just clippy`,
# `just test`, `just docs`, `just deny`, `just size`, `just repro`), so a green
# `just check` locally and a green CI mean the same thing. Tools are installed as
# prebuilt binaries at the versions the justfile pins; every third-party action
# is pinned to a full commit SHA with its version in a comment.
#
# Required checks (branch protection on main, applied from docs/github-settings.md):
# fmt; clippy and test on the three runners; the test locale leg on the three
# runners; msrv (pinned) and msrv (stable); deny; docs; size on macos-26 and
# ubuntu-24.04; build-time; repro; changelog. Not required: intel-mac (best
# effort) and size-comment (it only posts the size).

name: CI

on:
  pull_request:
    # labeled/unlabeled let the `no-changelog` label re-evaluate the changelog
    # check. The whole workflow reruns on those events: a job skipped by `if:`
    # reports success, and would mask a failed check from the run before it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    # Daily on main: catches toolchain drift (the msrv stable leg) and registry
    # drift (the advisory database, web links) without a push, and makes "green
    # for seven days" measurable.
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request replaces its running CI; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The task runner every job uses (the justfile pins the cargo tools, not just itself).
  JUST_VERSION: "1.59.0"
  # The markdown link checker of the docs job, verified against this checksum.
  LYCHEE_VERSION: "0.24.2"
  LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
  # Cold release build budget in seconds; tightened after phase 1 to the measured
  # value plus 10% (the size budget lives in the justfile as size_budget).
  BUILD_TIME_BUDGET_SECS: "90"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just fmt

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - run: just clippy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
        # default: the runner's environment. locale: TZ=America/Los_Angeles and
        # LC_ALL=fr_FR.UTF-8, which the testkit must shield every test from.
        leg: [default, locale]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - name: Generate the fr_FR.UTF-8 locale
        if: matrix.leg == 'locale' && runner.os == 'Linux'
        run: sudo locale-gen fr_FR.UTF-8
      - name: just test
        if: matrix.leg == 'default'
        run: just test
      - name: just test under TZ=America/Los_Angeles LC_ALL=fr_FR.UTF-8
        if: matrix.leg == 'locale'
        env:
          TZ: America/Los_Angeles
          LC_ALL: fr_FR.UTF-8
        run: |
          # Not `locale -a | grep -q`: grep exits at the first match, and macOS's
          # locale then fails to flush, which pipefail reports as a failure.
          locales=$(locale -a)
          grep -Eiq '^fr_FR\.utf-?8$' <<<"$locales" || { echo "::error::fr_FR.UTF-8 is not available on this runner"; exit 1; }
          date
          just test
      # The fixture tree (P0-TEST-01) is built and cached here by its manifest hash,
      # and the du parity tests run in this job, once those packages land.

  msrv:
    name: msrv (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        # pinned: rust-toolchain.toml, which must name the workspace rust-version
        # (1.88). stable: the newest release, built and tested without clippy.
        toolchain: [pinned, stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the ${{ matrix.toolchain }} toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [[ $TOOLCHAIN == stable ]]; then
            rustup toolchain install stable --profile minimal
            echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
            rustup run stable rustc --version
          else
            rustup toolchain install --profile minimal
            channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
            msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
            version=$(rustc --version)
            echo "$version (rust-toolchain.toml: $channel, rust-version: $msrv)"
            [[ -n $msrv && $channel == "$msrv" && $version == "rustc $msrv."* ]] || {
              echo "::error::the pinned toolchain must be the MSRV exactly: rust-toolchain.toml says '$channel', Cargo.toml rust-version says '$msrv', rustc says '$version'"
              exit 1
            }
          fi
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - run: just test

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Read the cargo-deny version pinned in the justfile
        id: pins
        run: echo "cargo_deny=$(just --evaluate cargo_deny_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@${{ steps.pins.outputs.cargo_deny }}
      - name: just deny advisories licenses bans sources
        run: |
          [[ -f deny.toml ]] || echo "::notice title=deny::no deny.toml yet (P0-REPO-04), so cargo deny is skipped; this job checks for real once it lands"
          just deny advisories licenses bans sources

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: just docs (rustdoc with warnings denied)
        run: just docs
      - name: Install lychee
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Markdown links in README.md and docs/
        env:
          # lychee uses it against GitHub's rate limit on the daily web-link run.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=()
          [[ -f README.md ]] && files+=(README.md)
          files+=(docs/**/*.md)
          if (( ${#files[@]} == 0 )); then
            echo "::notice title=docs::no README.md or docs/*.md yet, so the link check is skipped"
            exit 0
          fi
          # Pull requests and pushes check relative links and anchors offline, so a
          # remote site's outage cannot block a merge; the daily run checks web links too.
          offline=(--offline)
          [[ $GITHUB_EVENT_NAME == schedule ]] && offline=()
          lychee --version
          lychee --no-progress --include-fragments --root-dir "$GITHUB_WORKSPACE" "${offline[@]}" "${files[@]}"
      # Added by later packages:
      # - name: duscope man renders                  # P1: `duscope man | mandoc -T lint` is clean
      # - name: Envelope fixtures validate          # P2: `duscope schema --envelope <verb>` against JSON Schema 2020-12

  size:
    name: size (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            key: macos
          - os: ubuntu-24.04
            key: ubuntu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    outputs:
      macos: ${{ steps.size.outputs.macos }}
      ubuntu: ${{ steps.size.outputs.ubuntu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: just size
        id: size
        env:
          KEY: ${{ matrix.key }}
          OS: ${{ matrix.os }}
        run: |
          set +e
          just size 2>&1 | tee "$RUNNER_TEMP/size.log"
          status=${PIPESTATUS[0]}
          set -e
          host=$(rustc -vV | sed -n 's/^host: //p')
          line=$(grep -m1 '^duscope: ' "$RUNNER_TEMP/size.log" || echo "no size reported")
          (( status == 0 )) || line="$line; FAILED (just size exited $status)"
          echo "$KEY=$line ($host)" >> "$GITHUB_OUTPUT"
          echo "$OS: $line ($host)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  size-comment:
    name: size-comment
    needs: size
    # Pull requests from this repository only: a fork's token cannot comment.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the size comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MACOS: ${{ needs.size.outputs.macos }}
          UBUNTU: ${{ needs.size.outputs.ubuntu }}
        run: |
          marker='<!-- duscope-size -->'
          body=$(cat <<EOF
          $marker
          **Release binary size** (\`just size\`, stripped, at ${HEAD_SHA:0:7})

          | Runner | Size |
          | --- | --- |
          | macos-26 | ${MACOS:-not reported} |
          | ubuntu-24.04 | ${UBUNTU:-not reported} |

          The budget is \`size_budget\` in the justfile.
          EOF
          )
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" --jq .html_url
          fi

  build-time:
    name: build-time
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      # No build cache: the build below must be cold. Downloads are not compile
      # time, so they happen first and the timed build runs offline.
      - name: Fetch dependencies (not timed)
        run: cargo fetch --locked
      - name: Cold cargo build --release
        run: |
          start=$(date +%s.%N)
          cargo build --release --locked --offline -p duscope
          end=$(date +%s.%N)
          secs=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.1f", e - s }')
          echo "cold cargo build --release: ${secs} s of the ${BUILD_TIME_BUDGET_SECS} s budget" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$secs" -v b="$BUILD_TIME_BUDGET_SECS" 'BEGIN { exit !(t <= b) }' || {
            echo "::error title=build-time::the cold release build took ${secs} s, over the ${BUILD_TIME_BUDGET_SECS} s budget"
            exit 1
          }

  repro:
    name: repro
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Fetch dependencies
        run: cargo fetch --locked
      # Two `just repro` builds into two target directories: the first is exactly what
      # a developer runs, the second runs from a copy of the checkout at another path
      # into a target directory with a longer name, so a path that escapes the
      # recipe's --remap-path-prefix shows up as a difference. No build cache: both
      # builds are cold.
      - name: Two just repro builds, compared
        run: |
          copy="$RUNNER_TEMP/duscope-copy"
          cp -a "$GITHUB_WORKSPACE" "$copy"
          just repro | tee "$RUNNER_TEMP/a.sha256"
          (cd "$copy" && just repro target/repro-second) | tee "$RUNNER_TEMP/b.sha256"
          a=$(awk '{ print $1 }' "$RUNNER_TEMP/a.sha256")
          b=$(awk '{ print $1 }' "$RUNNER_TEMP/b.sha256")
          if [[ -n $a && $a == "$b" ]] && cmp target/repro/release/duscope "$copy/target/repro-second/release/duscope"; then
            echo "repro: both builds are byte-identical, SHA-256 $a" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=repro::the two builds differ: $a versus $b"
            exit 1
          fi

  intel-mac:
    name: intel-mac
    # Best effort and not required: Intel macOS builds without the test suite.
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked

  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the merge of the pull request into main, HEAD^1 is main.
          fetch-depth: 2
      - name: A changelog.d/<ID>.md fragment that parses, or the no-changelog label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The title and labels are read live, so re-running this job picks up a
          # renamed title as well as a label added since the push.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          title=$(jq -r .title <<<"$pr")
          labelled=$(jq -r '[.labels[].name] | any(. == "no-changelog")' <<<"$pr")
          mapfile -t fragments < <(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- 'changelog.d/*.md' | grep -vx 'changelog.d/README.md' || true)

          # Every fragment the pull request adds or changes must parse: the
          # keep-a-changelog sections as '### <Section>' headings, each with '- ' items.
          status=0
          if (( ${#fragments[@]} )); then
            python3 - "${fragments[@]}" <<'PY' || status=1
          import re
          import sys

          SECTIONS = ("Added", "Changed", "Deprecated", "Removed", "Fixed", "Security")
          failed = set()

          def error(path, line, message):
              failed.add(path)
              print(f"::error file={path},line={line}::{message}")

          for path in sys.argv[1:]:
              try:
                  with open(path, encoding="utf-8") as f:
                      text = f.read()
              except (OSError, UnicodeDecodeError) as e:
                  error(path, 1, f"cannot read the fragment as UTF-8: {e}")
                  continue
              section, items = None, {}
              for n, line in enumerate(text.splitlines(), 1):
                  if not line.strip():
                      continue
                  heading = re.fullmatch(r"### (.+?)\s*", line)
                  if heading:
                      section = heading.group(1)
                      if section not in SECTIONS:
                          error(path, n, f"unknown section '### {section}': use one of {', '.join(SECTIONS)}")
                      elif section in items:
                          error(path, n, f"section '### {section}' appears twice")
                      items[section] = 0
                  elif line.startswith("#"):
                      error(path, n, "only '### <Section>' headings belong in a fragment; release.yml writes the version heading")
                  elif section is None:
                      error(path, n, "text before the first '### <Section>' heading")
                  elif re.match(r"- \S", line):
                      items[section] += 1
                  elif re.match(r"\s+\S", line) and items[section]:
                      pass  # continuation of the item above
                  else:
                      error(path, n, "expected a '- ' list item or an indented continuation line")
              if not items:
                  error(path, 1, f"no '### <Section>' heading: use one of {', '.join(SECTIONS)}")
              for name, count in items.items():
                  if count == 0:
                      error(path, 1, f"section '### {name}' has no '- ' items")
              if path not in failed:
                  print(f"{path}: parses")

          sys.exit(1 if failed else 0)
          PY
          fi

          if [[ $labelled == true ]]; then
            echo "::notice title=changelog::the no-changelog label is set, so no fragment is required"
            exit "$status"
          fi
          if [[ ! $title =~ ^([A-Z][A-Z0-9]*(-[A-Z0-9]+)*): ]]; then
            echo "::error title=changelog::the title '$title' does not start with '<ID>: ', so no fragment name can be derived; fix the title or ask the author for the no-changelog label"
            exit 1
          fi
          fragment="changelog.d/${BASH_REMATCH[1]}.md"
          if ! grep -qx "$fragment" <<<"$(printf '%s\n' "${fragments[@]}")"; then
            echo "::error title=changelog::add $fragment (keep-a-changelog lines under '### Added', '### Fixed', ...) or, when nothing is user-visible, ask the author for the no-changelog label"
            exit 1
          fi
          echo "changelog: $fragment found"
          exit "$status"
