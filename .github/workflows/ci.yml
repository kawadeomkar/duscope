# Throwaway (not for merging): times interrupted scans on the CI runners. Each
# iteration runs the Ctrl-C test once with DUSCOPE_TEST_TRACE_INTERRUPT set and
# prints its timeline in ms after the signal: watcher-woke, walk-returned,
# interrupts-dropped, main-return, or grace-over and forced-exit, then exited.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  sigint-timing:
    name: sigint timing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - name: Build the test
        run: cargo test --locked -p duscope --test scan_errors --no-run
      - name: Time 40 interrupted scans
        shell: bash
        run: |
          for i in $(seq 1 40); do
            cargo test -q --locked -p duscope --test scan_errors p1_walk_08_sigint_exits_130_within_200_ms -- --nocapture 2>&1 \
              | grep '^TIMING' || echo "TIMING run=$i none"
          done | tee timings.txt
          {
            echo "### $RUNNER_OS: forced exits $(grep -c forced-exit timings.txt) of $(wc -l < timings.txt)"
            echo '```'
            sort -t= -k2 -g timings.txt | tail -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
