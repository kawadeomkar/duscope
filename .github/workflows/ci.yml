# duscope CI: the merge gate for every pull request (plan/SPEC.md "CI/CD", P0-CI-01).
#
# Budget: 20 minutes per job, enforced by `timeout-minutes: 20` on every job; the
# target is under 10 minutes of wall time per job.
#
# The jobs run the justfile recipes developers run (`just fmt`, `just clippy`,
# `just test`, `just docs`, `just deny`, `just size`, `just repro`), so a green
# `just check` locally and a green CI mean the same thing. Tools are installed as
# prebuilt binaries at the versions the justfile pins; every third-party action
# is pinned to a full commit SHA with its version in a comment.
#
# Required checks (branch protection on main, applied from docs/github-settings.md):
# fmt; clippy, test, platform and bench-regression on the three runners; the test
# locale leg on the three runners; msrv (pinned) and msrv (stable); deny; docs;
# schemas; size on macos-26 and ubuntu-24.04; build-time; repro; changelog. Not
# required: intel-mac (best effort) and size-comment (it only posts the size).

name: CI

on:
  pull_request:
    # labeled/unlabeled let the `no-changelog` label re-evaluate the changelog
    # check. The whole workflow reruns on those events: a job skipped by `if:`
    # reports success, and would mask a failed check from the run before it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    # Daily on main: catches toolchain drift (the msrv stable leg) and registry
    # drift (the advisory database, web links) without a push, and makes "green
    # for seven days" measurable.
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its running CI. Every other run (a push
  # to main, the schedule, a dispatch) has a group of its own commit: GitHub keeps
  # only the newest waiting run of a group, so a group per ref would skip a commit
  # that reached main while two runs were ahead of it.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The task runner every job uses (the justfile pins the cargo tools, not just itself).
  JUST_VERSION: "1.59.0"
  # The benchmark runner bench-regression drives, as `just setup` pins it.
  HYPERFINE_VERSION: "2.0.0"
  # The markdown link checker of the docs job, verified against this checksum.
  LYCHEE_VERSION: "0.24.2"
  LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
  # Cold release build budgets in seconds, one per CPU model of the shared
  # ubuntu-24.04 runners (P1-REL-01, DEV-59, DEV-62): each model's slowest cold
  # build plus 10%, rounded up, and below the spec's 90 s ceiling (DEV-66). Not
  # the median: runners of one model differ by up to a fifth, and the second
  # build below runs on the same runner. With the bundled SQLite (P2-IDX-02) at
  # -O1 (Cargo.toml), the slowest of 42 builds on 21 runners (run 41235689135,
  # 32 builds, and run 41185724842, 10; 2026-10-31): Xeon Platinum 8573C 81.2 s
  # (2 builds), EPYC 7763 78.4 s (20), Xeon 6973P-C 75.1 s (2), EPYC 9V74 64.6 s
  # (2), EPYC 9V45 58.4 s (16); 81.2 s plus 10% reaches the ceiling, so the 8573C
  # is held to 89 s. A model not listed is held to the largest budget, with a
  # notice to add it. A build over its budget is measured once more before the
  # job fails (DEV-53). The size budget lives in the justfile as size_budget.
  BUILD_TIME_BUDGETS: |
    INTEL(R) XEON(R) PLATINUM 8573C=89
    AMD EPYC 7763 64-Core Processor=87
    Intel(R) Xeon(R) 6973P-C=83
    AMD EPYC 9V74 80-Core Processor=72
    AMD EPYC 9V45 96-Core Processor=65

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just fmt

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - run: just clippy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
        # default: the runner's environment. locale: TZ=America/Los_Angeles and
        # LC_ALL=fr_FR.UTF-8, which the testkit must shield every test from.
        leg: [default, locale]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      - name: Generate the fr_FR.UTF-8 locale
        if: matrix.leg == 'locale' && runner.os == 'Linux'
        run: sudo locale-gen fr_FR.UTF-8
      - name: Install bash 4 or later and fish
        # macOS ships bash 3.2, and the test that runs the changelog job needs 4 or
        # later; `just setup` installs it the same way. fish loads the completions
        # in P1-CLI-04's test (macOS ships zsh and mandoc).
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install bash fish
          "$(brew --prefix)/bin/bash" --version
      - name: Install zsh, fish, mandoc and ncdu
        # P1-CLI-04's tests load the completions in zsh and fish and lint the man
        # page with mandoc, and P2-CLI-02's reads an export back with ncdu; in CI
        # a missing one fails them.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq zsh fish mandoc ncdu
      - name: just test
        if: matrix.leg == 'default'
        run: just test
      - name: just test under TZ=America/Los_Angeles LC_ALL=fr_FR.UTF-8
        if: matrix.leg == 'locale'
        env:
          TZ: America/Los_Angeles
          LC_ALL: fr_FR.UTF-8
        run: |
          # Not `locale -a | grep -q`: grep exits at the first match, and macOS's
          # locale then fails to flush, which pipefail reports as a failure.
          locales=$(locale -a)
          grep -Eiq '^fr_FR\.utf-?8$' <<<"$locales" || { echo "::error::fr_FR.UTF-8 is not available on this runner"; exit 1; }
          date
          just test
      # A golden test that failed leaves this runner's goldens, regenerated, as an
      # artifact: the copies for an OS the author does not have at hand
      # (duscope/tests/golden/README.md).
      - name: Regenerate the goldens after a failure
        if: failure() && matrix.leg == 'default'
        run: just golden || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.leg == 'default'
        with:
          name: goldens-${{ matrix.os }}
          path: duscope/tests/golden/
          retention-days: 14
      # The fixture tree (P0-TEST-01) is built in this job by the tests that use it,
      # and not cached between runs: actions/cache's tar archive would restore its
      # sparse files fully allocated, its clones as copies and its compressed files
      # uncompressed, and drop its socket, so a restored tree would not be the tree
      # its record describes. The du parity tests on the fixture tree run here.

  platform:
    # The tests that mount filesystems (loop devices, tmpfs, bind mounts, an exFAT
    # image), attach disk images and scan the real / on macOS: ignored by default
    # and run as root here (P1-TEST-01), by name, through `just platform-tests`,
    # the recipe `just check-full` runs. The system-tree du parity and the bench
    # trees' RSS run in nightly-bench.yml, on the bench runners, not on pull
    # requests.
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install exfatprogs
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q exfatprogs
      - name: The platform tests, as root
        run: |
          # Built as the runner's user; each test binary runs under sudo, which
          # mounting needs, keeping the environment the testkit reads.
          host=$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${host}_RUNNER=sudo -E"
          just platform-tests

  bench-regression:
    # The harness on T1 against this job's results on pushes to main (DEV-20,
    # bench/compare.py): duscope's p50 and its ratio to diskus, each against the
    # last five results from the same CPU model. The shared runners come with
    # several, and the ratio differs between them as the time does (on
    # ubuntu-24.04, 0.51 on one model and 0.60 to 0.67 on another). A regression
    # beyond 15% fails only when a second measurement reproduces it. main keeps its
    # result whatever the comparison says, so a slowdown merged on purpose fails
    # pull requests only until main's own results make up most of each CPU model's
    # five.
    name: bench-regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Reading the result files earlier runs on main left as artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: hyperfine@${{ env.HYPERFINE_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build duscope
        run: cargo build --release --locked -p duscope
      - name: Measure T1
        id: measure
        run: |
          file=$(bench/run.sh run --subject duscope --tool-path "duscope=$PWD/target/release/duscope" \
            --trees T1 --competitors diskus --mode warm \
            --trees-dir "$RUNNER_TEMP/trees" --tools-dir "$RUNNER_TEMP/tools" --results-dir "$RUNNER_TEMP/results")
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Fetch the baselines
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
        run: |
          base="$RUNNER_TEMP/baselines"
          mkdir -p "$base"
          # This job's result files from the last 30 pushes to main that kept one,
          # whatever else in those runs failed: enough for compare.py to find five
          # from this run's CPU model among the shared runners' several. Only
          # pushes: a pull request from a fork's branch named main is a
          # pull_request run, never a push to this main.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status completed --limit 30 --json databaseId --jq '.[].databaseId')
          found=0
          for id in $ids; do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "bench-regression-$OS" \
              --dir "$base/$id" 2>/dev/null; then
              found=$((found + 1))
            fi
          done
          echo "$found baseline result(s) from main"
      - name: Compare with main
        env:
          FILE: ${{ steps.measure.outputs.file }}
        run: |
          shopt -s nullglob
          baselines=("$RUNNER_TEMP"/baselines/*/)
          compare() {
            python3 bench/compare.py "$1" "${baselines[@]}" --tree T1 --last 5 --tolerance 0.15
          }
          status=0
          compare "$FILE" || status=$?
          if (( status == 1 )); then
            echo "::warning title=bench-regression::beyond 15% on the first measurement; measuring again"
            again=$(bench/run.sh run --subject duscope --tool-path "duscope=$PWD/target/release/duscope" \
              --trees T1 --competitors diskus --mode warm \
              --trees-dir "$RUNNER_TEMP/trees" --tools-dir "$RUNNER_TEMP/tools" \
              --out "$RUNNER_TEMP/results/again.json")
            status=0
            compare "$again" || status=$?
          fi
          exit "$status"
      # A push to main keeps its result as a baseline for the pull requests after it,
      # even when the comparison failed: main's speed is what later changes answer to.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.measure.outputs.file != '' }}
        with:
          name: bench-regression-${{ matrix.os }}
          path: ${{ steps.measure.outputs.file }}
          if-no-files-found: error
          retention-days: 90

  msrv:
    name: msrv (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        # pinned: rust-toolchain.toml, which must name the workspace rust-version
        # (1.88). stable: the newest release, built and tested without clippy.
        toolchain: [pinned, stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the ${{ matrix.toolchain }} toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [[ $TOOLCHAIN == stable ]]; then
            rustup toolchain install stable --profile minimal
            echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
            rustup run stable rustc --version
          else
            rustup toolchain install --profile minimal
            channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
            msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
            version=$(rustc --version)
            echo "$version (rust-toolchain.toml: $channel, rust-version: $msrv)"
            [[ -n $msrv && $channel == "$msrv" && $version == "rustc $msrv."* ]] || {
              echo "::error::the pinned toolchain must be the MSRV exactly: rust-toolchain.toml says '$channel', Cargo.toml rust-version says '$msrv', rustc says '$version'"
              exit 1
            }
          fi
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install zsh, fish, mandoc and ncdu
        # As in the test job: P1-CLI-04's and P2-CLI-02's tests need them in CI.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq zsh fish mandoc ncdu
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - run: just test

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Read the cargo-deny version pinned in the justfile
        id: pins
        run: echo "cargo_deny=$(just --evaluate cargo_deny_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@${{ steps.pins.outputs.cargo_deny }}
      - name: just deny advisories licenses bans sources
        run: just deny advisories licenses bans sources

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: just docs (rustdoc with warnings denied)
        run: just docs
      - name: Install lychee
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Markdown links in README.md and docs/
        env:
          # lychee uses it against GitHub's rate limit on the daily web-link run.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=()
          [[ -f README.md ]] && files+=(README.md)
          files+=(docs/**/*.md)
          if (( ${#files[@]} == 0 )); then
            echo "::notice title=docs::no README.md or docs/*.md yet, so the link check is skipped"
            exit 0
          fi
          # Pull requests and pushes check relative links and anchors offline, so a
          # remote site's outage cannot block a merge; the daily run checks web links too.
          offline=(--offline)
          [[ $GITHUB_EVENT_NAME == schedule ]] && offline=()
          lychee --version
          lychee --no-progress --include-fragments --root-dir "$GITHUB_WORKSPACE" "${offline[@]}" "${files[@]}"
      # Added by later packages:
      # - name: duscope man renders                  # P1: `duscope man | mandoc -T lint` is clean
      # - name: Envelope fixtures validate          # P2: `duscope schema --envelope <verb>` against JSON Schema 2020-12

  schemas:
    name: schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
      # The drift test is a unit test of duscope-core: the envelope types derive
      # schemars::JsonSchema only under cfg(test), which keeps schemars out of the
      # binary, and cfg(test) does not reach the library an integration test links.
      - name: The files under schemas/ equal the schemas derived from their types (x-* stripped)
        run: |
          count=$(cargo test --locked -p duscope-core --lib -- --list schema_drift:: | grep -c ': test$' || true)
          (( count > 0 )) || { echo "::error title=schemas::duscope-core has no schema_drift:: unit tests"; exit 1; }
          cargo test --locked -p duscope-core --lib -- schema_drift::
      - name: schemars and jsonschema stay dev-dependencies
        run: cargo test --locked -p duscope-core --test schema_drift
      - name: Every file passes JSON Schema 2020-12, with valid property names and $id
        run: cargo test --locked -p duscope --test schemas
      # Added by P2-CLI-01: every historical envelope golden validates against the current schema.

  size:
    name: size (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The two binaries the budget holds (the spec's arm64 macOS and x86_64
        # musl); the musl build also keeps the release targets linking.
        include:
          - os: macos-26
            key: macos
            target: ""
          - os: ubuntu-24.04
            key: ubuntu
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    outputs:
      macos: ${{ steps.size.outputs.macos }}
      ubuntu: ${{ steps.size.outputs.ubuntu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the musl target and musl-tools
        if: matrix.target != ''
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q musl-tools
      - name: just size
        id: size
        env:
          KEY: ${{ matrix.key }}
          OS: ${{ matrix.os }}
          TARGET: ${{ matrix.target }}
        run: |
          set +e
          just size "$TARGET" 2>&1 | tee "$RUNNER_TEMP/size.log"
          status=${PIPESTATUS[0]}
          set -e
          host=${TARGET:-$(rustc -vV | sed -n 's/^host: //p')}
          line=$(grep -m1 '^duscope: ' "$RUNNER_TEMP/size.log" || echo "no size reported")
          (( status == 0 )) || line="$line; FAILED (just size exited $status)"
          echo "$KEY=$line ($host)" >> "$GITHUB_OUTPUT"
          echo "$OS: $line ($host)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  size-comment:
    name: size-comment
    needs: size
    # Pull requests from this repository only: a fork's token cannot comment.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the size comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MACOS: ${{ needs.size.outputs.macos }}
          UBUNTU: ${{ needs.size.outputs.ubuntu }}
        run: |
          marker='<!-- duscope-size -->'
          body=$(cat <<EOF
          $marker
          **Release binary size** (\`just size\`, stripped, at ${HEAD_SHA:0:7})

          | Runner | Size |
          | --- | --- |
          | macos-26 | ${MACOS:-not reported} |
          | ubuntu-24.04 | ${UBUNTU:-not reported} |

          The budget is \`size_budget\` in the justfile.
          EOF
          )
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" --jq .html_url
          fi

  build-time:
    name: build-time
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      # No build cache: the build below must be cold. Downloads are not compile
      # time, so they happen first and the timed build runs offline.
      - name: Fetch dependencies (not timed)
        run: cargo fetch --locked
      # The shared runners come with several CPU models, whose cold builds of the
      # same code differ by a third, so each model has a budget of its own.
      - name: This machine's budget
        run: |
          cpu=$(sed -n 's/^model name[[:space:]]*: //p' "${DUSCOPE_TEST_CPUINFO:-/proc/cpuinfo}" \
            | head -n 1 | sed 's/[[:space:]]*$//')
          budget=$(awk -F= -v cpu="$cpu" '$1 == cpu { print $2; exit }' <<< "$BUILD_TIME_BUDGETS")
          if [[ -z $budget ]]; then
            budget=$(cut -d= -f2 <<< "$BUILD_TIME_BUDGETS" | sort -n | tail -n 1)
            echo "::notice title=build-time::no budget for ${cpu:-this CPU} in BUILD_TIME_BUDGETS; holding it to the largest, ${budget} s"
          fi
          echo "cold build budget on ${cpu:-this CPU}: ${budget} s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "BUILD_TIME_BUDGET_SECS=$budget" >> "$GITHUB_ENV"
      # `-p duscope`: the binary a user builds. The unpublished test members
      # (mktree, duscope-testkit) are not part of a release build. A build over
      # budget is measured again from cold and fails only when the second is over
      # too, as bench-regression measures again (DEV-53): that absorbs a moment's
      # noise on the runner, while the budgets above absorb a slower runner.
      - name: Cold cargo build --release
        run: |
          # Called as a command, not in $(...), so a failed build fails the step.
          cold_build() {
            start=$(date +%s.%N)
            cargo build --release --locked --offline -p duscope
            end=$(date +%s.%N)
            secs=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.1f", e - s }')
          }
          within() { awk -v t="$secs" -v b="$BUILD_TIME_BUDGET_SECS" 'BEGIN { exit !(t <= b) }'; }
          cold_build
          echo "cold cargo build --release: ${secs} s of the ${BUILD_TIME_BUDGET_SECS} s budget" | tee -a "$GITHUB_STEP_SUMMARY"
          within && exit 0
          echo "::warning title=build-time::the cold release build took ${secs} s, over the ${BUILD_TIME_BUDGET_SECS} s budget; building again from cold"
          cargo clean
          cold_build
          echo "cold cargo build --release, again: ${secs} s of the ${BUILD_TIME_BUDGET_SECS} s budget" | tee -a "$GITHUB_STEP_SUMMARY"
          within || {
            echo "::error title=build-time::the cold release build took ${secs} s on a second build too, over the ${BUILD_TIME_BUDGET_SECS} s budget"
            exit 1
          }

  repro:
    name: repro
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Fetch dependencies
        run: cargo fetch --locked
      # Two `just repro` builds into two target directories: the first is exactly what
      # a developer runs, the second runs from a copy of the checkout at another path
      # into a target directory with a longer name, so a path that escapes the
      # recipe's --remap-path-prefix shows up as a difference. No build cache: both
      # builds are cold.
      - name: Two just repro builds, compared
        run: |
          copy="$RUNNER_TEMP/duscope-copy"
          cp -a "$GITHUB_WORKSPACE" "$copy"
          just repro | tee "$RUNNER_TEMP/a.sha256"
          (cd "$copy" && just repro target/repro-second) | tee "$RUNNER_TEMP/b.sha256"
          a=$(awk '{ print $1 }' "$RUNNER_TEMP/a.sha256")
          b=$(awk '{ print $1 }' "$RUNNER_TEMP/b.sha256")
          if [[ -n $a && $a == "$b" ]] && cmp target/repro/release/duscope "$copy/target/repro-second/release/duscope"; then
            echo "repro: both builds are byte-identical, SHA-256 $a" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=repro::the two builds differ: $a versus $b"
            exit 1
          fi

  intel-mac:
    name: intel-mac
    # Best effort and not required: Intel macOS builds without the test suite.
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked

  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the merge of the pull request into main, HEAD^1 is main.
          fetch-depth: 2
      - name: A changelog.d/<ID>.md fragment that parses, or the no-changelog label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The title and labels are read live, so re-running this job picks up a
          # renamed title as well as a label added since the push.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          title=$(jq -r .title <<<"$pr")
          labelled=$(jq -r '[.labels[].name] | any(. == "no-changelog")' <<<"$pr")
          mapfile -t fragments < <(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- 'changelog.d/*.md' | grep -vx 'changelog.d/README.md' || true)

          # Every fragment the pull request adds or changes must parse. The rule
          # lives in scripts/changelog.py, whose `assemble` the REL: vX.Y.Z pull
          # request runs.
          status=0
          if (( ${#fragments[@]} )); then
            python3 scripts/changelog.py check "${fragments[@]}" || status=1
          fi

          if [[ $labelled == true ]]; then
            echo "::notice title=changelog::the no-changelog label is set, so no fragment is required"
            exit "$status"
          fi
          if [[ ! $title =~ ^([A-Z][A-Z0-9]*(-[A-Z0-9]+)*): ]]; then
            echo "::error title=changelog::the title '$title' does not start with '<ID>: ', so no fragment name can be derived; fix the title or ask the author for the no-changelog label"
            exit 1
          fi
          fragment="changelog.d/${BASH_REMATCH[1]}.md"
          if ! grep -qx "$fragment" <<<"$(printf '%s\n' "${fragments[@]}")"; then
            echo "::error title=changelog::add $fragment (keep-a-changelog lines under '### Added', '### Fixed', ...) or, when nothing is user-visible, ask the author for the no-changelog label"
            exit 1
          fi
          echo "changelog: $fragment found"
          exit "$status"
