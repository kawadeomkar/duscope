# Temporary, on this branch only (never merged): builds the two x86_64 musl
# binaries P1-BENCH-03's bench-linux measurement compares, on a GitHub-hosted
# runner, since from-scratch builds on the bench host's VMs crash rustc at
# random. The shipped build allocates with mimalloc; the other is the same
# source with the global_allocator item removed, so it uses musl's own.
name: Allocator build (temporary)

on:
  push:
    branches: [p1-bench-03-allocator-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain, the musl target and musl-tools
        run: |
          rustup toolchain install --profile minimal && rustc --version
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q musl-tools
      - name: Build with mimalloc (the shipped build)
        run: |
          cargo build --release --locked -p duscope --target x86_64-unknown-linux-musl
          mkdir -p out && cp target/x86_64-unknown-linux-musl/release/duscope out/duscope-mimalloc
      - name: Build with musl's own allocator
        run: |
          sed -i '/^\/\/\/ The musl builds/,/^static ALLOCATOR/d' duscope/src/main.rs
          if grep -q global_allocator duscope/src/main.rs; then echo "global_allocator still present" >&2; exit 1; fi
          cargo build --release --locked -p duscope --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/duscope out/duscope-musl
          git checkout -- duscope/src/main.rs
          sha256sum out/* | tee out/SHA256SUMS
          echo "commit: $GITHUB_SHA" >> out/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocator-binaries
          path: out/
          if-no-files-found: error
          retention-days: 7
