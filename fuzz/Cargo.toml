# The fuzz targets: a crate of its own outside the workspace, as cargo-fuzz
# lays it out, built and run on nightly only (`cargo +nightly fuzz run
# <target>`). libfuzzer-sys is the libFuzzer runtime cargo-fuzz builds the
# targets against, serde_json reads back what the jsonrpc target writes, and
# rusqlite, the workspace's own, changes the rows of the index_rows target's
# copy of an index; nothing here reaches the binary.
[package]
name = "duscope-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
duscope-core = { path = "../crates/duscope-core" }
duscope-mcp = { path = "../crates/duscope-mcp" }
duscope-walk = { path = "../crates/duscope-walk" }
libfuzzer-sys = "=0.4.13"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

# Not a member of the repository's workspace.
[workspace]
members = ["."]

[[bin]]
name = "sql"
path = "fuzz_targets/sql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ncdu"
path = "fuzz_targets/ncdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gdu"
path = "fuzz_targets/gdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gpscan"
path = "fuzz_targets/gpscan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "args"
path = "fuzz_targets/args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonrpc"
path = "fuzz_targets/jsonrpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_rows"
path = "fuzz_targets/index_rows.rs"
test = false
doc = false
bench = false
